<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<!-- mentor_app v3.11 — Plano de hoje navegável (escolher, anterior/próxima, mais aulas da semana), 'feita' vem do banco; v3.10.1 — revisão só com questão do assunto (melhor encaixe) + botão 'Não é deste assunto'; v3.10 REGRAS DO VALTER: aula abre por questão (vídeo = plano B), cards de Certo/Errado, geração opt-in, baralhos, ciclo do dia, reforço; v3.9 REVISÃO À LA ANKI: cards no FSRS (4 notas, 10 min, leech, teto pela prova), cards de questão, card do erro pela questão, lacunas, card livre, fechamento do dia; BASE: trilha por modo, regra do aquecimento, prova de base, base por matéria -->
<title>Mike Mentor — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== tokens: os mesmos do site da TipMike ===== */
:root{
  --bg:#0b0f1a; --bg2:#070a13; --card:#141a28; --card2:#1a2030; --hover:#1d2434; --border:#222a3d;
  --line:rgba(60,85,130,.4);
  --fg:#eaeef7; --soft:#a8b3c9; --muted:#6b7691;
  --acc:#10b981; --acc2:#0891b2; --acc400:#34d399; --cyan400:#22d3ee;
  --amber:#f59e0b; --amber400:#fbbf24; --red:#ef4444; --red400:#f87171; --violet400:#a78bfa;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(16,185,129,.3);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(16,185,129,.6);background-clip:padding-box;border:2px solid transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(16,185,129,.3) transparent}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.ic svg{width:100%;height:100%;display:block}
.muted{color:var(--muted)} .soft{color:var(--soft)} .small{font-size:.8125rem}
.rotulo{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:.35rem 0}

/* ===== efeitos da TipMike ===== */
@keyframes mike-live-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.7)}50%{opacity:.85;box-shadow:0 0 0 5px rgba(16,185,129,0)}}
@keyframes mike-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:mike-live-pulse 1.4s ease-out infinite}
.ponto-live{width:7px;height:7px;border-radius:50%;background:var(--acc400);animation:mike-live-pulse 1.4s ease-out infinite}

/* ===== cabeçalho ===== */
.topo{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(11,15,26,.8);border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topo-in{max-width:1280px;margin:0 auto;height:56px;padding:0 clamp(12px,3vw,32px);display:flex;align-items:center;gap:16px}
.marca{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 4px 10px rgba(16,185,129,.3);font-weight:900;color:var(--bg);font-size:15px}
.marca b{font-family:var(--mono);font-weight:800;letter-spacing:-.02em;font-size:15px}
.abas{display:flex;align-items:center;gap:4px;margin-left:12px}
.aba{position:relative;display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .15s,background .15s}
.aba .ic{width:14px;height:14px}
.aba:hover{color:var(--fg)}
.aba[aria-selected="true"]{color:var(--acc)}
.aba[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-11px;height:2px;border-radius:2px;background:var(--acc)}
.espaco{flex:1}
.crono{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 12px 4px 8px;font-size:12px;cursor:pointer;color:var(--soft);transition:border-color .15s}
.crono:hover{border-color:rgba(16,185,129,.5)}
.crono .ponto{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.crono.on .ponto{background:var(--acc400)}
.crono b{font-family:var(--mono);font-weight:700;color:var(--fg);font-size:12.5px}
.usuario{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:.5px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;color:var(--bg);font-size:12px}
.usuario span{display:flex;flex-direction:column;line-height:1.15}
.usuario span b{font-size:11px}
.usuario span i{font-style:normal;font-size:9.5px;color:var(--muted)}

main{max-width:1280px;margin:0 auto;padding:28px clamp(12px,3vw,32px) 64px}
section[role="tabpanel"]{animation:entra .25s ease-out}
.aviso{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--soft);background:rgba(245,158,11,.08);border:.5px solid rgba(245,158,11,.35);border-radius:10px;padding:10px 12px;margin:0 0 22px;max-width:760px}
.aviso .ic{color:var(--amber400);margin-top:1px}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.cab p{margin:.2rem 0 0}
.bloco-texto{max-width:70ch}

/* ===== peças básicas ===== */
.card,.painel,.kpi,.qcard,.semana,.assunto,.materia,.progresso{background:var(--card);border:1px solid var(--border);border-radius:12px}
.painel{padding:16px 18px}
.painel-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.painel-cab h3{display:flex;align-items:center;gap:8px}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--acc);color:var(--bg);box-shadow:0 4px 12px rgba(16,185,129,.3);transition:filter .15s,transform .05s;text-decoration:none}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--card);color:var(--soft);border:1px solid var(--border);box-shadow:none}
.btn.sec:hover{border-color:var(--acc);color:var(--acc);filter:none}
.btn .ic{width:16px;height:16px}
.icone-tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid}
.icone-tile .ic{width:17px;height:17px}
.t-em{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:var(--acc400)}
.t-cy{background:rgba(8,145,178,.15);border-color:rgba(34,211,238,.3);color:var(--cyan400)}
.t-am{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:var(--amber400)}
.t-re{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--red400)}
.t-vi{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.3);color:var(--violet400)}
.t-mu{background:var(--card2);border-color:var(--border);color:var(--muted)}
.seletor,.periodo{display:inline-flex;flex-wrap:wrap;gap:6px}
.seletor button,.periodo button{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.seletor button:hover,.periodo button:hover{color:var(--fg);background:var(--hover)}
.seletor button[aria-pressed="true"],.periodo button[aria-pressed="true"]{background:rgba(16,185,129,.15);color:var(--acc400);border-color:rgba(16,185,129,.45);box-shadow:0 4px 14px rgba(16,185,129,.18)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.base{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:var(--amber400)}
.chip.completo{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--acc400)}
.chip.expresso{background:rgba(8,145,178,.12);border-color:rgba(34,211,238,.35);color:var(--cyan400)}
.chip.propria{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.35);color:var(--violet400)}
.medidor{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s ease}
.medidor.brass i{background:linear-gradient(90deg,var(--amber),var(--amber400))}
.vazio-box{border:1px dashed var(--border);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.vazio-box .icone-tile{margin-bottom:4px}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.grafico{width:100%;height:auto;display:block}
.grafico text{fill:var(--muted);font:600 12px system-ui,sans-serif}

/* ===== início ===== */
.agora{position:relative;overflow:hidden;border-radius:16px;padding:22px 22px 20px;margin-bottom:16px;
  background:radial-gradient(600px 220px at 0% 0%,rgba(16,185,129,.12),transparent 70%) ,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,rgba(16,185,129,.55),rgba(8,145,178,.45) 60%,rgba(34,42,61,1)) border-box;
  border:1px solid transparent}
.agora .rot{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--acc400);display:flex;align-items:center;gap:8px}
.agora h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:900;line-height:1.1;margin:.3rem 0 .15rem}
.agora .mat{color:var(--soft);font-size:14px}
.trilha{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.trilha li{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:rgba(7,10,19,.45);border:1px solid var(--border);transition:border-color .2s,background .2s}
.trilha li b{display:block;font-size:13px;font-weight:700}
.trilha li span{font-size:11.5px;color:var(--muted);line-height:1.35}
.trilha li.atual{border-color:rgba(34,211,238,.5);background:rgba(8,145,178,.1);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
.trilha li.feito{opacity:.7}
.trilha li.feito b{color:var(--acc400)}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.agora.vazio{background:var(--card);border:1px solid var(--border)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:12px 14px;display:flex;gap:12px;align-items:center}
.kpi>div:last-child{flex:1;min-width:0}
.kpi .val{font-size:1.4rem;font-weight:900;line-height:1.15}
.kpi .val small{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:11px;color:var(--muted)}
.hoje-lista{list-style:none;margin:0;padding:0}
.hoje-acao{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.hoje-acao .voltar{padding:4px 9px;font-size:12px}
.agora-tag{color:var(--acc400);font-weight:700}
.mais-aulas details{min-width:0}.mais-aulas summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}.mais-aulas summary::-webkit-details-marker{display:none}.mais-aulas summary b{display:inline}.mais-aulas summary .ic{transition:transform .15s;align-self:center}.mais-aulas details[open] summary .ic{transform:rotate(180deg)}
.extra-lista{list-style:none;margin:8px 0 0;padding:0;max-height:340px;overflow:auto}
.hoje-lista li.mais-aulas{align-items:start}
.hoje-lista .extra-lista li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border)}
.hoje-lista .extra-lista li:last-child{border-bottom:0}
.hoje-lista .extra-lista li div{min-width:0;display:flex;flex-direction:column}
.hoje-lista .extra-lista li .voltar{justify-self:end;white-space:nowrap}
.nav-aula{margin-left:auto;display:inline-flex;gap:6px;text-transform:none;letter-spacing:0}
.nav-aula .btn-flag{padding:4px 9px;font-size:12px}
.btn-flag[disabled]{opacity:.4;cursor:default}
.btn-flag.confirma,.voltar.confirma{border-color:var(--amber400);color:var(--amber400)}
.ok-chip{display:inline-flex;align-items:center;gap:6px;color:var(--acc400);border-color:rgba(16,185,129,.45)}
@media (max-width:640px){.hoje-lista .extra-lista li{grid-template-columns:1fr;gap:6px}.hoje-lista .extra-lista li .voltar{justify-self:start}.nav-aula .btn-flag{padding:4px 7px}.hoje-lista li{grid-template-columns:auto 1fr}.hoje-lista li>.hoje-acao{grid-column:2}}
.hoje-lista li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.hoje-lista li:last-child{border-bottom:0}
.hoje-lista b{font-size:14px;display:block}
.hoje-lista .icone-tile{width:30px;height:30px;border-radius:8px}
.hoje-lista .icone-tile .ic{width:15px;height:15px}
.exemplo{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer}
.exemplo input{accent-color:var(--acc)}
.barras-mat{display:flex;flex-direction:column;gap:12px}
.barras-mat .l{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.barras-mat .l span{color:var(--muted)}
.foco .kpis,.foco .grade2,.foco .exemplo,.foco #hoje{display:none}

/* ===== sessão / questões ===== */
#sessao{animation:entra .2s ease-out}
.qcard{padding:18px 20px;max-width:820px}
.qcard.sess{max-width:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pontos{display:flex;gap:6px;align-items:center}
.pontos i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border);display:block}
.pontos i.ok{background:var(--acc);border-color:var(--acc)}
.pontos i.x{background:var(--red);border-color:var(--red)}
.pontos i.at{border-color:var(--cyan400);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.fonte-q{font-size:11.5px;color:var(--muted);margin:0 0 6px}
.enun{font-size:15.5px;line-height:1.6;margin:0 0 14px;max-width:75ch}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid var(--border);background:var(--card2);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.alt:hover{border-color:rgba(16,185,129,.4);background:var(--hover)}
.alt b{font-family:var(--mono);font-size:12px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--border);color:var(--soft)}
.alt span{padding-top:3px;font-size:14.5px}
.alt[aria-pressed="true"]{border-color:rgba(34,211,238,.6);background:rgba(8,145,178,.1)}
.alt[aria-pressed="true"] b{border-color:var(--cyan400);color:var(--cyan400)}
.alt.certa{border-color:rgba(16,185,129,.6);background:rgba(16,185,129,.1)}
.alt.certa b{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.alt.errada{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.1)}
.alt.errada b{background:var(--red);border-color:var(--red);color:#fff}
.conf{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conf button{border:1px solid;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:none;display:inline-flex;gap:6px;align-items:center;transition:background .15s}
.conf button[data-c="certeza"]{color:var(--acc400);border-color:rgba(16,185,129,.45)}
.conf button[data-c="certeza"]:hover{background:rgba(16,185,129,.12)}
.conf button[data-c="duvida"]{color:var(--amber400);border-color:rgba(245,158,11,.45)}
.conf button[data-c="duvida"]:hover{background:rgba(245,158,11,.12)}
.conf button[data-c="chute"]{color:var(--red400);border-color:rgba(239,68,68,.45)}
.conf button[data-c="chute"]:hover{background:rgba(239,68,68,.12)}
.conf kbd,.atalhos kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--bg2)}
.resultado{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;animation:entra .2s ease-out}
.veredito{font-weight:900;font-size:1.15rem;display:inline-flex;align-items:center;gap:6px}
.veredito.ok{color:var(--acc400)} .veredito.x{color:var(--red400)}
.resolucao{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--cyan400);border-radius:10px;padding:12px 14px}
.res-cab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--cyan400);margin-bottom:6px}
.res-txt{font-size:14px;line-height:1.6;color:var(--soft);max-width:78ch}
.res-txt.curto{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.ler-mais{border:0;background:none;color:var(--cyan400);font-size:12.5px;font-weight:700;padding:6px 0 0;cursor:pointer}
.destino{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--soft)}
.destino .ic{color:var(--amber400);margin-top:2px}
.atalhos{font-size:11px;color:var(--muted);margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.player{aspect-ratio:16/9;width:100%;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(8,145,178,.18),transparent 60%),var(--bg2);border:1px solid var(--border);display:grid;place-items:center;text-align:center;padding:20px;color:var(--soft)}
.player-in{max-width:48ch}
.player-in .icone-tile{width:56px;height:56px;border-radius:50%;margin:0 auto 10px}
.player-in .icone-tile .ic{width:24px;height:24px}
.nota-final{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.anel{width:86px;height:86px;flex:none}
.anel text{font:900 22px system-ui;fill:var(--fg)}
.placar{display:flex;gap:26px;margin:0 0 14px;flex-wrap:wrap}
.placar div{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.placar b{display:block;font-size:1.6rem;color:var(--fg);line-height:1.1;font-weight:900;text-transform:none;letter-spacing:0}

/* ===== planejamento ===== */
.semanas{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.semana{position:relative;padding:14px 16px 14px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;overflow:hidden;transition:border-color .15s,background .15s}
.semana::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border)}
.semana.atual{border-color:rgba(16,185,129,.4);box-shadow:0 0 0 1px rgba(16,185,129,.12),0 8px 24px rgba(16,185,129,.08)}
.semana.atual::before{background:linear-gradient(var(--acc),var(--acc2))}
.semana.trancada .n,.semana.trancada .t{color:var(--soft)}
.semana .n{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.semana.atual .n{color:var(--acc400)}
.semana .t{font-size:14.5px;font-weight:700;line-height:1.35;max-width:52ch}
.semana .d{font-size:12px;color:var(--muted)}
.semana .medidor{width:100%}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:8px;padding:6px 12px;border:1px solid var(--border);background:var(--card2);color:var(--muted)}
.estado.abrir{background:var(--acc);border-color:var(--acc);color:var(--bg);cursor:pointer;box-shadow:0 4px 12px rgba(16,185,129,.25)}
.estado .ic{width:13px;height:13px}
.voltar{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--soft);transition:border-color .15s,color .15s}
.voltar:hover{border-color:var(--acc);color:var(--acc)}
.sem-cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.sem-cab h2{margin:0}
.sem-cab .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.progresso{padding:14px 16px}
.progresso .topo2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.progresso .pct{font-weight:900;font-size:1.5rem}
.progresso .pct small{font-size:.8rem;color:var(--muted);font-weight:600}
.materia{margin-bottom:12px;overflow:hidden}
.materia>button{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;border:0;background:none;padding:12px 16px;cursor:pointer;text-align:left}
.materia>button:hover{background:var(--hover)}
.materia>button .muted{font-size:12px}
.cont{font-family:var(--mono);font-weight:700;font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:1px 9px;color:var(--soft)}
.materia .corpo{border-top:1px solid var(--border);padding:4px 16px 12px}
.ass-plan{border-bottom:1px dashed var(--border);padding:14px 0}
.ass-plan:last-child{border-bottom:0}
.ass-plan .topo3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ass-plan .topo3 b{font-size:14.5px}
.caminhos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.caminho{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--card2);color:var(--soft);transition:border-color .15s}
.caminho:has(input:checked){border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.1);color:var(--fg)}
.caminho input{accent-color:var(--acc);margin:0}
.caminho.rec::after{content:"recomendado";font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber400);margin-left:2px}
.passos{list-style:none;margin:2px 0 0;padding:0}
.passos li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:5px 0;font-size:13.5px}
.passos li .pn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);min-width:3.4rem;padding-top:2px}
.passos li input{width:17px;height:17px;accent-color:var(--acc);margin-top:2px;cursor:pointer}
.passos li.feito span:last-child{color:var(--muted);text-decoration:line-through}
.passos .auto{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--cyan400);margin-left:6px}
.revs{list-style:none;margin:0;padding:0}
.revs li{display:grid;grid-template-columns:auto 5.6rem 3.2rem 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.revs li:last-child{border-bottom:0}
.revs b{font-family:var(--mono);font-size:12px;color:var(--cyan400)}
.revs input{width:17px;height:17px;accent-color:var(--acc)}
.pend-mat{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}

/* ===== edital ===== */
.modulo{margin:20px 0 6px}
.modulo h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.assunto{margin-bottom:6px;transition:border-color .15s}
.assunto:hover{border-color:#2c3650}
.assunto .linha{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.assunto.fora{opacity:.55}
.check{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.tier{font-family:var(--mono);font-weight:800;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:12px;border:1px solid}
.tS{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--amber400)}
.tA{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:var(--acc400)}
.tB{background:rgba(8,145,178,.15);border-color:rgba(34,211,238,.4);color:var(--cyan400)}
.tC{background:var(--card2);border-color:var(--border);color:var(--muted)}
.tN{background:none;border-style:dashed;border-color:var(--border);color:var(--muted)}
.tBase{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.55);color:var(--amber400)}
.tBase .ic{width:14px;height:14px}
.nome{font-weight:700;font-size:14px;line-height:1.3}
.nome .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.num{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.num b{font-weight:800;color:var(--fg);font-size:13px}
.abrir{border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:6px;color:var(--muted);vertical-align:middle}
.abrir:hover{color:var(--acc)}
.abrir .ic{width:15px;height:15px}
.aulas{list-style:none;margin:0;padding:0 14px 10px 86px;font-size:12.5px;color:var(--soft)}
.aulas li{padding:3px 0;display:flex;gap:6px;align-items:center}
.aulas li .ic{width:13px;height:13px;color:var(--muted)}
.rodape-edital{position:sticky;bottom:0;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ===== questões: filtro ===== */
.q-rodape{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.q-mat{border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--card2)}
.q-mat.pend{padding:10px 12px;border-style:dashed;background:none;font-size:13px}
.q-mat-cab{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.q-mat-cab label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.q-mat-cab .abrir{margin-left:auto}
.q-mat input{width:17px;height:17px;accent-color:var(--acc)}
.q-mat-corpo{border-top:1px solid var(--border);padding:4px 12px 10px}
.q-grupo{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:10px 0 4px}
.q-ass{display:flex;align-items:center;gap:9px;padding:6px 6px;cursor:pointer;border-radius:7px;font-size:13.5px;transition:background .12s}
.q-ass:hover{background:var(--hover)}
.q-ass:not(.est) span:first-of-type{color:var(--soft)}
.q-ass.est span:first-of-type{font-weight:700}

/* ===== plano geral ===== */
.linhas-orc{display:flex;flex-direction:column;gap:14px;max-width:860px}
.orc .topo4{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13.5px;margin-bottom:6px;flex-wrap:wrap}
.orc .topo4 span{font-weight:500;color:var(--muted);font-size:12px}
.orc .trilho{height:10px;border-radius:5px;background:var(--bg2);border:1px solid var(--border);overflow:hidden;display:flex}
.orc .base{background:var(--amber)} .orc .resto{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.orc.pend{opacity:.6}
.orc.pend .trilho{background-image:linear-gradient(90deg,rgba(60,85,130,.1) 0%,rgba(60,85,130,.3) 50%,rgba(60,85,130,.1) 100%);background-size:200% 100%;animation:mike-shimmer 2.4s infinite linear}
.painel ul{margin:6px 0 0;padding-left:18px;color:var(--soft);font-size:13.5px}
.painel li{margin:5px 0}
.cal{list-style:none;margin:12px 0 0;padding:0;border-left:2px solid var(--border)}
.cal li{position:relative;padding:6px 0 6px 16px;font-size:13.5px}
.cal li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--cyan400);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.cal li.fechou::before{background:var(--acc);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.cal b{font-family:var(--mono);font-size:12px;margin-right:8px;color:var(--fg)}
.cal .atr{color:var(--red400);font-size:12px}

/* ===== simulados ===== */
.sim-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.sim-hero .data{font-family:var(--mono);font-weight:800;font-size:2.4rem;line-height:1;color:var(--fg)}
.regras{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dist{width:100%;border-collapse:collapse;font-size:13.5px}
.dist td{padding:6px 0;border-bottom:1px dashed var(--border)}
.dist td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
.dist tr.bloco td{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);padding-top:12px}
.cal-sim{list-style:none;margin:0;padding:0}
.cal-sim li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.cal-sim li:last-child{border-bottom:0}
.cal-sim .icone-tile{width:32px;height:32px;border-radius:8px}
.hist li{grid-template-columns:auto 1fr auto}
.nota-mini{font-family:var(--mono);font-weight:800;font-size:15px}
.sim-barra{position:sticky;top:57px;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(11,15,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.sim-barra .relogio-sim{font-family:var(--mono);font-weight:800;font-size:1.25rem;color:var(--amber400)}
.sim-grade{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.folha{position:sticky;top:130px}
.folha-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.folha-grid button{font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:7px;padding:7px 0;cursor:pointer;position:relative}
.folha-grid button.resp{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.45);color:var(--acc400)}
.folha-grid button.marc::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber400)}
.folha-grid button.at{box-shadow:0 0 0 2px var(--cyan400);color:var(--fg)}
.btn-flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--soft);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.btn-flag.on{border-color:rgba(245,158,11,.55);color:var(--amber400);background:rgba(245,158,11,.1)}
.res-mat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
@media (max-width:860px){.sim-grade{grid-template-columns:1fr}.folha{position:static}.sim-hero{grid-template-columns:1fr}.sim-barra{top:0}}

/* ===== toast ===== */
.toast{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid rgba(16,185,129,.45);border-radius:10px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13.5px;font-weight:600;animation:toast-in .2s ease-out}
.toast .ic{color:var(--acc400)}

/* ===== celular ===== */
@media (max-width:860px){
  .topo{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(11,15,26,.97)}
  .abas{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;justify-content:space-around;gap:0;background:rgba(11,15,26,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .aba{flex-direction:column;gap:3px;font-size:10px;padding:5px 2px;flex:1;white-space:nowrap;min-width:0}
  .aba .ic{width:19px;height:19px}
  .aba[aria-selected="true"]::after{top:-7px;bottom:auto;left:28%;right:28%}
  .usuario span{display:none}
  main{padding-bottom:96px}
  .trilha{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aulas{padding-left:14px}
  .rodape-edital{bottom:62px;padding:8px 0}
  .rodape-edital .muted{display:none}
  .rodape-edital .btn{width:100%}
  .assunto .linha{grid-template-columns:auto auto 1fr}
  .assunto .num{grid-column:3;text-align:left}
  .revs li{grid-template-columns:auto 4.6rem 2.8rem 1fr}
  .revs li .muted{display:none}
  .toast{left:12px;right:12px;bottom:76px}
  .atalhos{display:none}
}
@media (max-width:520px){.usuario{display:none}.crono{padding:4px 10px 4px 8px}
  .trilha li{flex-direction:column;gap:6px;padding:9px}
  .trilha .icone-tile{width:30px;height:30px}
  .agora{padding:18px 16px}
  .qcard{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <button class="marca" id="marca" title="Início"><span class="logo">M</span><b>MIKE MENTOR</b></button>
    <nav class="abas" role="tablist" aria-label="Seções">
      <button class="aba" role="tab" aria-selected="true" aria-controls="p-inicio" id="t-inicio" data-i="home">Início</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-plano" id="t-plano" data-i="calendar-days">Planejamento</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-revisao" id="t-revisao" data-i="rotate-ccw">Revisão</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-edital" id="t-edital" data-i="list-checks">Edital</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-questoes" id="t-questoes" data-i="circle-help">Questões</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-sim" id="t-sim" data-i="clipboard-check">Simulados</button>
      <button class="aba" role="tab" aria-selected="false" aria-controls="p-geral" id="t-geral" data-i="bar-chart-3">Plano geral</button>
    </nav>
    <div class="espaco"></div>
    <button class="crono" id="crono" title="Cronômetro do estudo"><span class="ponto" id="crono-ponto"></span><span id="crono-txt">hoje</span><b id="crono-val">0 min</b></button>
    <div class="usuario" id="usuario"><span class="avatar">I</span><span><b>Iuri</b><i>Soldado PMBA</i></span></div>
  </div>
</header>

<main></main>
<div id="toast-box"></div>

<script>window.__MAIN="\n  \n  <!-- INICIO -->\n  <section role=\"tabpanel\" id=\"p-inicio\" aria-labelledby=\"t-inicio\">\n    <div id=\"agora\"></div>\n    <div id=\"sessao\"></div>\n    <div class=\"card painel\" id=\"hoje\" style=\"margin-bottom:16px\"></div>\n    <div class=\"kpis\" id=\"kpis\"></div><label class=\"exemplo\" hidden><input type=\"checkbox\" id=\"chk-exemplo\"> Mostrar um exemplo com duas semanas de uso (dados inventados, s\u00f3 pra ver como fica)</label>\n    <div class=\"grade2\">\n      <div class=\"painel\">\n        <div class=\"painel-cab\"><h3><span class=\"ic\" data-i=\"clock\" style=\"color:var(--acc400)\"></span>Horas estudadas</h3>\n          <div class=\"periodo\" id=\"per-horas\"><button aria-pressed=\"true\" data-p=\"7\">7 dias</button><button aria-pressed=\"false\" data-p=\"30\">30 dias</button><button aria-pressed=\"false\" data-p=\"0\">Tudo</button></div></div>\n        <div id=\"graf-horas\"></div>\n      </div>\n      <div class=\"painel\">\n        <div class=\"painel-cab\"><h3><span class=\"ic\" data-i=\"target\" style=\"color:var(--cyan400)\"></span>Quest\u00f5es de concurso</h3><button class=\"voltar\" id=\"ir-questoes\"><span class=\"ic\" data-i=\"circle-help\"></span>Fazer quest\u00f5es</button></div>\n        <div id=\"resumo-q\"></div>\n      </div>\n    </div>\n      </section>\n\n  <!-- PLANEJAMENTO -->\n  <section role=\"tabpanel\" id=\"p-plano\" aria-labelledby=\"t-plano\" hidden>\n    <div id=\"plano-lista\">\n      <div class=\"cab\"><div><h2>Planejamento</h2><p class=\"muted small bloco-texto\">A semana seguinte libera quando voc\u00ea conclui a atual. O mentor monta cada semana toda segunda, com as horas e o desempenho reais da anterior.</p></div>\n        <div class=\"seletor\" id=\"sel-fase\"><button aria-pressed=\"true\" data-f=\"longo\">At\u00e9 31/01</button><button aria-pressed=\"false\" data-f=\"reta\">Reta final</button></div></div>\n      <div class=\"semanas\" id=\"semanas\"></div>\n    </div>\n    <div id=\"plano-semana\" hidden></div>\n  </section>\n\n  <section role=\"tabpanel\" id=\"p-revisao\" aria-labelledby=\"t-revisao\" hidden><div id=\"rev-painel\"></div></section>\n\n  <!-- EDITAL -->\n  <section role=\"tabpanel\" id=\"p-edital\" aria-labelledby=\"t-edital\" hidden>\n    <div class=\"cab\">\n      <div><h2>Edital verticalizado</h2><p class=\"muted small bloco-texto\">Marque \"estudei\" no que voc\u00ea estudou por fora. A estrela \u00e9 a base da mat\u00e9ria; a letra \u00e9 o tier (S cai muito na prova de Soldado da PM-BA). \"Exigem\" s\u00e3o quest\u00f5es que precisam desse assunto pra ser resolvidas.</p></div>\n      <div class=\"filtros\"><div class=\"seletor\" id=\"sel-mat\"></div>\n        <div class=\"seletor\" id=\"sel-filtro\"><button aria-pressed=\"true\" data-f=\"corte\">Na linha de corte</button><button aria-pressed=\"false\" data-f=\"tudo\">Tudo</button></div></div>\n    </div>\n    <div id=\"lista-edital\"></div>\n    <div class=\"rodape-edital\"><button class=\"btn\" id=\"btn-fazer\"><span class=\"ic\" data-i=\"circle-help\"></span>Fazer quest\u00f5es</button><span class=\"muted small\" id=\"info-fazer\"></span></div>\n  </section>\n\n  <!-- QUESTOES -->\n  <section role=\"tabpanel\" id=\"p-questoes\" aria-labelledby=\"t-questoes\" hidden>\n    <div class=\"cab\"><div><h2>Fazer quest\u00f5es</h2><p class=\"muted small\">S\u00f3 quest\u00f5es de concurso. As respostas entram no placar e na repeti\u00e7\u00e3o.</p></div></div>\n    <div class=\"painel\" id=\"q-filtro\" style=\"max-width:820px\">\n      <div class=\"filtros\" style=\"justify-content:space-between\">\n        <div class=\"seletor\" id=\"q-modo\"><button aria-pressed=\"true\" data-m=\"estudei\">Tudo que j\u00e1 estudei</button><button aria-pressed=\"false\" data-m=\"escolher\">Escolher mat\u00e9rias e assuntos</button></div>\n        <div class=\"seletor\" id=\"q-qtd\" aria-label=\"Quantidade\"><button aria-pressed=\"false\" data-q=\"10\">10</button><button aria-pressed=\"tr de base','target']];\n  return ETAPAS.filter(([id])=>id==='video'?temVideo(al):((id==='fix'||id==='gate2')?!!sess.planoB:true)).map(([id,nome,ic])=>{ if(id==='bolso'&&m==='lei_seca') return [id,'Lei seca + resumo',ic]; if(id==='bolso'&&m==='leitura') return [id,'Resumo próprio',ic]; return [id,nome,ic];});}\nconst PORQUE={pre:'Abre a gaveta: errando antes, o cérebro caça a resposta no resumo.',bolso:'A teoria rápida: 2 minutos pra saber do que se trata. Não precisa virar doutor pra ir pras questões.',gate:'É treinando que se fica bom na prova. 4 de 5 fecha a aula sem vídeo; chute conta como erro.',video:'Plano B: só quando as questões mostram que falta base. Sem anotar; a cada 10 min, recall.',fix:'Plano B: primeira prática logo depois do vídeo, com a explicação do Gran.',gate2:'Plano B: 5 questões novas. 4 de 5 fecha; abaixo, a aula fica com ressalva e a R1 cobra amanhã.',erros:'Uma linha por erro: vira card de Certo/Errado (como a prova) e a questão volta no fechamento do dia.'};\nconst TIPO_LINHA={regra:'Regra',contraste:'Contraste',pegadinha:'Pegadinha',desatencao:'Desatenção'};\n/* v3.9: o card do erro nasce da própria questão — frente = o ponto testado, verso = gabarito + comentário. Você só escreve a linha. */\nfunction curtoTxt(t,n){t=String(t||'').replace(/\\s+/g,' ').trim();return t.length<=n?t:t.slice(0,n-1).trimEnd()+'…'}\nfunction propostaCard(q,escolha,gab,explic){ if(!q) return {};\n  /* Valter: pergunta aberta não se responde em 20 s; o card bom é afirmação de Certo/Errado, como a prova. */\n  gab=(gab||q.gab||q.gabarito||'').toString().toUpperCase(); const alts=q.alts?q.alts.map(a=>[a[0],a[1]]):(q.alternativas||[]).map(a=>[a.letra,a.texto]);\n  const txtDe=l=>{const a=alts.find(x=>(x[0]||'').toUpperCase()===l);return a?String(a[1]||''):''};\n  const enun=curtoTxt(q.enunciado,200); const ex=curtoTxt(explic||q.explicacao||'',280); const esc_=(escolha||'').toUpperCase();\n  const ce=alts.length===2&&alts.every(a=>/^(C|E)$/i.test(String(a[0]||'')));\n  const cards=[];\n  if(ce){ cards.push({frente:`${enun}\\n\\nCerto ou errado?`,verso:`${gab==='C'?'CERTO':'ERRADO'}${ex?'. '+ex:''}`,com_linha:true}); }\n  else {\n    if(esc_&&esc_!==gab&&txtDe(esc_)) cards.push({frente:`${enun}\\n\\nJulgue: \"${curtoTxt(txtDe(esc_),260)}\"`,verso:`ERRADO. O certo é ${gab}) ${curtoTxt(txtDe(gab),220)}${ex?'\\n'+ex:''}`,com_linha:true});\n    if(txtDe(gab)) cards.push({frente:`${enun}\\n\\nJulgue: \"${curtoTxt(txtDe(gab),260)}\"`,verso:`CERTO${ex?'. '+ex:''}`,com_linha:!cards.length});\n  }\n  return {cards,frente:cards[0]?cards[0].frente:'',verso:cards[0]?cards[0].verso:''}; }\nfunction fmtIntervalo(s){ if(s==null) return '—'; if(s<3600) return Math.max(1,Math.round(s/60))+' min'; if(s<86400) return Math.round(s/3600)+' h'; const d=Math.round(s/86400); if(d<30) return d+' d'; if(d<365) return Math.round(d/7)+' sem'; return Math.round(d/30)+' meses'; }\nconst NOTA_TXT={1:'Errei',2:'Difícil',3:'Lembrei',4:'Fácil'};\nconst ESTADO_CARD={novo:'novo',aprendendo:'aprendendo',revisao:'revisão',reaprendendo:'reaprendendo',suspenso:'leech',dominado:'dominado'};\nfunction clozeHtml(frente,revelado){ return esc(frente).replace(/\\{\\{c::(.+?)\\}\\}/g,(m,x)=>`<span class=\"lacuna\">${revelado?x:'&nbsp;'.repeat(Math.min(18,Math.max(6,x.length)))}</span>`).replace(/\\n+/g,'<br>'); }\nconst DICA_LINHA={regra:'a regra certa, em uma frase — ex.: \"Furto: sem violência. Roubo: com violência ou grave ameaça\"',contraste:'A ≠ B — ex.: \"Emenda constitucional: 3/5 em 2 turnos ≠ lei complementar: maioria absoluta\"',pegadinha:'a palavra que me pegou — ex.: \"\\'exclusivamente\\' = errado; a competência é concorrente\"',desatencao:'o que eu li errado — não vira card, só conta'};\nconst HOJE_REV=window.__HOJE_REV||{revisoes:0,questoes:0,lista:[],cards:0,caderno_abertas:0,caderno_por_materia:{}};\nlet rodando=null, inicioSeg=0, segSessao=0, verPainel=false;\nlet sess=ler('mm3_sessao',{aula:0,etapa:null,q:0,certasGate:0,marcas:[],fim:false});\nsess.erros=sess , das setas ou de \"mais aulas da semana\". No meio de uma aula pede confirmação no próprio botão. */\nfunction irPraAula(i,btn){\n  if(i<0||i>=HOJE_AULAS.length) return;\n  if(i===sess.aula&&!sess.fim){document.getElementById('agora').scrollIntoView({behavior:'smooth',block:'start'});return;}\n  if(emAndamento()&&btn&&btn.dataset.conf!=='1'){const antes=btn.innerHTML;btn.dataset.conf='1';btn.classList.add('confirma');btn.innerHTML=`${I('rotate-ccw')}Trocar mesmo? A aula atual recomeça`;\n    setTimeout(()=>{if(btn.isConnected&&btn.dataset.conf==='1'){btn.dataset.conf='';btn.classList.remove('confirma');btn.innerHTML=antes;}},4000);return;}\n  if(emAndamento()) toast('A aula de antes ficou pela metade: as respostas já contam e, quando voltar, ela recomeça','rotate-ccw');\n  novaAula(i); sess.fim=false; crono(false); salvarSess(); renderInicio();\n  document.getElementById('agora').scrollIntoView({behavior:'smooth',block:'start'});\n}\nasync function porNoDia(aulaId,btn){\n  if(btn){btn.disabled=true;}\n  const r=await __api('/mentor/hoje/escolher',{aula_id:aulaId});\n  if(!r||!r.item){if(btn)btn.disabled=false;toast('Não consegui pôr essa aula no dia agora','circle-x');return;}\n  const k=HOJE_EXTRA.findIndex(x=>x.aula_id===aulaId); if(k>=0) HOJE_EXTRA.splice(k,1);\n  let i=HOJE_AULAS.findIndex(x=>x.codigo===r.item.codigo);\n  if(i<0){HOJE_AULAS.push(r.item);i=HOJE_AULAS.length-1;}\n  if(emAndamento()){toast('Entrou no fim do plano de hoje','list-checks');renderHoje();return;}\n  toast('Aula no plano de hoje','list-checks'); irPraAula(i,null);\n}\nfunction crono(liga){ if(liga&&!rodando){inicioSeg=Date.now();rodando=setInterval(tick,1000);} if(!liga&&rodando){clearInterval(rodando);rodando=null;} pintarCrono(); }\nfunction tick(){\n  const agora=Date.now(); segSessao++;\n  if(agora-inicioSeg>=60000){horas[HOJE]=(horas[HOJE]||0)+1;inicioSeg=agora;gravar('mm3_horas',horas);if(abaVisivel()==='inicio'&&!sess.etapa){renderKpis();renderHoras();}}\n  if(sess.etapa==='video  class=\"cab\"><div><h2>Revisão</h2><p class=\"muted small bloco-texto\">Três coisas, todo dia, antes das aulas novas: <b>questões</b> das revisões da curva do esquecimento (R1 amanhã, R7, R30, manutenção; o intervalo estica quando acerta e encurta quando erra), <b>cards</b> no FSRS (o agendador do Anki: Errei volta em 10 min, o resto é marcado pra você lembrar com 90% de chance; a questão errada vira card e volta no fechamento do dia) e o <b>caderno de erros</b>, que você lê 5 min antes da matéria. Teto: 35% do dia. Nada aqui é reler ou rever vídeo: revisar é responder.</p></div></div>\n    <div class=\"grade2\" style=\"margin-top:0\">\n      <div class=\"agora\" style=\"margin:0\"><div class=\"rot\">${I('rotate-ccw')}1. Questões · hoje</div><h1>${pend.length?pend.length+' revisão'+(pend.length>1?'ões':''):'Nenhuma revisão hoje'}</h1><div class=\"mat\">${pend.length?pend.map(x=>`${x.tipo} · ${esc(x.nome)}${x.atrasada?' (atrasada)':''}`).join(' · '):'A primeira R1 abre no dia seguinte ao fechamento de um assunto.'}</div>\n        ${pend.length?`<p class=\"soft small\" style=\"margin-top:8px\">${nq} questões · teto de ${r.teto_minutos} min hoje · erro anota no caderno; acerto risca a linha</p>`:''}<div class=\"acoes\">${pend.length?`<button class=\"btn\" id=\"rev-comecar\">${I('play')}Começar as revisões</button>`:''}</div></div>\n      <div class=\"painel\"><div class=\"painel-cab\"><h3>${I('calendar-days')}Próximas</h3></div><ul class=\"revs\">${prox.slice(0,14).map(x=>`<li><span></span><span>${esc(x[3])}</span><b>${x[2]}</b><span class=\"muted small\">${x[1]}</span><span class=\"muted small\">${x[4]} q</span></li>`).join('')||'<li class=\"muted small\">Nada agendado ainda.</li>'}</ul></div>\n    </div>\n    <div class=\"qcard\" id=\"rev-card\" hidden style=\"margin-top:16px\"></div>\n    <div class=\"grade2\">\n      <div class=\"painel\"><div class=\"painel-cab\"><h3>${I('layers')}2. Cards · FSRS</h3><span class=\"muted small\">Errei · Difícil · Lembrei · Fácil</span></div>\n        <p class=\"soft small\">Lê a frente, responde na cabeça, mostra, e diz como foi. <b>Errei</b> volta em 10 min nesta sessão; as outras notas agendam o card pra você lembrar com ~90% de chance (FSRS, o do Anki). Questão errada vira card e volta hoje mesmo. Errar 6 vezes na revisão = leech: sai da fila e vai pro caderno.</p>\n        ${fila&&(fila.por_materia||[]).length>1?`<div class=\"seletor baralhos\" id=\"baralhos\"><button data-mid=\"\" aria-pressed=\"${!__cardsMat}\">Todos</button>${fila.por_materia.map(m=>`<button data-mid=\"${m.id}\" aria-pressed=\"${+__cardsMat===m.id}\">${esc(m.nome)} <b>${m.n}</b></button>`).join('')}</div><p class=\"muted small\" style=\"margin:4px 0 8px\">Um baralho de cada vez: trocar de matéria a cada card gasta energia à toa. Em \"Todos\", a fila vem agrupada por matéria.</p>`:''}\n        <div class=\"cards-mat\">${T.curtos?`<span class=\"chip amb\">${T.curtos} de volta agora</span>`:''}${T.erros_hoje?`<span class=\"chip amb\">${T.erros_hoje} erro${T.erros_hoje>1?'s':''} de hoje</span>`:''}${T.vencidos?`<span class=\"chip\">${T.vencidos} revisão</span>`:''}${T.novos?`<span class=\"chip\">${T.novos} novo${T.novos>1?'s':''}</span>`:''}${T.voltam_hoje?`<span class=\"chip\">${T.voltam_hoje} volta${T.voltam_hoje>1?'m':''} mais tarde</span>`:''}<span class=\"chip\">feitos hoje <b>${fila?fila.feitos_hoje:0}</b>/${fila?fila.teto_dia:60}</span></div>\n        <div class=\"acoes\">${cs.length?`<button class=\"btn\" id=\"cards-comecar\">${I('play')}${modo==='fechamento'?'Fechar o dia':'Começar'} (${cs.length})</button>`:''}${(modo!=='fechamento'&&(T.erros_hoje||T.curtos))?`<button class=\"btn sec\" id=\"cards-fechar\">${I('moon')}Fechar o dia · só os erros de hoje</button>`:''}<button class=\"btn sec\" id=\"card-novo-btn\">${I('plus')}Novo card</button></div>\n        ${cs.length?'':`<div class=\"vazio-box\"><span class=\"icone-tile t-vi\">${I('layers')}</span>Nenhum card pra agora.<span class=\"small\">${fila&&fila.proximo_curto_em_s?`${T.voltam_hoje} volta${T.voltam_hoje>1?'m':''} em ${fmtIntervalo(fila.proximo_curto_em_s)}.`:'Nascem dos erros e dos chutes, das lacunas da lei seca e, se você pedir no fim da aula, do Gran e do resumo.'}</span></div>`}\n        <div id=\"card-novo-form\" hidden style=\"margin-top:12px\"></div>\n        <div id=\"card-box\" hidden style=\"margin-top:14px\"></div>\n        <p class=\"muted small\" id=\"cards-stats\" style=\"margin-top:12px\">${resumo&&resumo.metricas?`<b style=\"color:var(--fg)\">Hoje:</b> ${resumo.metricas.questoes_hoje} questões × ${resumo.metricas.cards_criados_hoje} cards criados${resumo.metricas.questoes_hoje>=resumo.metricas.cards_criados_hoje?'':' <span style=\"color:var(--amber400)\">(a meta é fazer mais questões do que criar cards)</span>'} · fila zerada ${resumo.metricas.seq_fila_zerada} dia${resumo.metricas.seq_fila_zerada===1?'':'s'} seguido${resumo.metricas.seq_fila_zerada===1?'':'s'}${resumo.metricas.zerou_hoje?' (hoje ✓)':''}<br>`:''}${resumo?`${resumo.retencao_observada!=null?`retenção observada <b>${resumo.retencao_observada}%</b> (alvo ${Math.round(100*resumo.retencao_alvo)}%) · `:''}${Object.entries(resumo.estados||{}).map(([k,v])=>`${ESTADO_CARD[k]||k} ${v}`).join(' · ')}${(resumo.leeches||[]).length?` · <b style=\"color:var(--amber400)\">${resumo.leeches.length} leech${resumo.leeches.length>1?'es':''}</b>`:''} · próximos 7 dias: ${(resumo.proximos_dias||[]).map(d=>d.vencem).join(' / ')} · prova ${fmtData(resumo.prova_data)} (teto ${resumo.teto_dias} d)`:''}</p>\n      </div>\n      <div class=\"painel\"><div class=\"painel-cab\"><h3>${I('file-text')}3. Caderno de erros</h3><div class=\"seletor\" id=\"cad-filtro\"><button aria-pressed=\"${__cadFiltro==='abertas'}\" data-f=\"abertas\">Abertas${cad?` (${cad.abertas})`:''}</button><button aria-pressed=\"${__cadFiltro==='todas'}\" data-f=\"todas\">Todas</button></div></div>\n        <p class=\"soft small\">Uma linha por erro, na sua mão, por matéria. <b>Riscada</b> = você acertou a questão de novo numa revisão. Se errar de novo, a linha volta e conta quantas vezes voltou: essas são as suas pegadinhas de prova. Leia as da matéria 5 min antes de cada sessão.</p>\n        <div id=\"cad-lista\">${cadernoListaHtml(linhas,true)}</div>\n      </div>\n    </div>`;\n  const b=document.getElementById('rev-comecar');if(b)b.onclick=async()=>{await __sessao();__rev={lista:pend,i:0,q:0,marcas:[],certas:0};passoRev()};\n  const bc=document.getElementById('cards-comecar');if(bc)bc.onclick=async()=>{await __sessao();__cards={lista:cs,i:0,virado:false,modo,fila,voltam:0};passoCard()};\n  box.querySelectorAll('#baralhos button').forEach(b=>b.onclick=()=>{__cardsMat=b.dataset.mid?+b.dataset.mid:null;renderRevisao()});\n  const bf=document.getElementById('cards-fechar');if(bf)bf.onclick=()=>{__cardsAuto='fechamento';renderRevisao()};\n  const bn=document.getElementById('card-novo-btn');if(bn)bn.onclick=()=>{const fm=document.getElementById('card-novo-form');fm.hidden=!fm.hidden;if(!fm.hidden){fm.innerHTML=formNovoCardHtml();ligarNovoCard(fm,()=>{fm.hidden=true;renderRevisao()});fm.querySelector('#cn-frente').focus();}};\n  if(__cardsAuto==='fechamento'){__cardsAuto=null;if(cs.length){await __sessao();__cards={lista:cs,i:0,virado:false,modo,fila,voltam:0};passoCard();document.getElementById('card-box').scrollIntoView({behavior:'smooth',block:'start'});}else toast('Nenhum erro de hoje pra fechar','check');}\n  box.querySelectorAll('#cad-filtro button').forEach(x=>x.onclick=()=>{__cadFiltro=x.dataset.f;renderRevisao()});\n  ligarCaderno(document.getElementById('cad-lista'));\n}\nfunction cadernoListaHtml(linhas,agrupar){\n  if(!linhas.length) return `<div class=\"vazio-box\"><span class=\"icone-tile t-am\">${I('file-text')}</span>Nenhuma linha${__cadFiltro==='abertas'&&agrupar?' aberta':''}.<span class=\"small\">Cada erro na fixação, no gate ou na revisão pede uma linha: regra, contraste ou pegadinha.</span></div>`;\n  const li=l=>`<li class=\"${l.riscada_em?'riscada':''}\" data-id=\"${l.id}\"><span class=\"tipo t-${l.tipo}\">${TIPO_LINHA[l.tipo]||l.tipo}</span><div><b>${esc(l.linha)}</b>${l.enunciado?`<span class=\"muted small\">${esc(l.enunciado)}</span>`:''}<span class=\"muted small\">${l.assunto?esc(l.assunto):''}${l.aula?' · '+esc(l.aula):''}${l.contexto?' · '+esc(l.contexto):''}</span></div><span class=\"volt\">${l.voltou?`voltou ×${l.voltou}`:''}</span><button class=\"btn-flag\" data-r=\"${l.riscada_em?0:1}\" title=\"${l.riscada_em?'Voltar pra aberta':'Riscar: já sei'}\">${l.riscada_em?I('rotate-ccw')+'voltar':I('check')+'riscar'}</button></li>`;\n  if(!agrupar) return `<ul class=\"caderno\">${linhas.map(li).join('')}</ul>`;\n  const g={};linhas.forEach(l=>{(g[l.materia||'Sem matéria']=g[l.materia||'Sem matéria']||[]).push(l)});\n  return Object.entries(g).map(([m,ls],i)=>`<details class=\"cad-mat\" ${i<3?'open':''}><summary>${esc(m)} <span class=\"muted small\">${ls.filter(l=>!l.riscada_em).length} aberta${ls.filter(l=>!l.riscada_em).length!==1?'s':''}${ls.filter(l=>l.riscada_em).length?` · ${ls.filter(l=>l.riscada_em).length} riscada${ls.filter(l=>l.riscada_em).length>1?'s':''}`:''}</span></summary><ul class=\"caderno\">${ls.map(li).join('')}</ul></details>`).join('');\n}\nasync function recarregarCaderno(){const cad=await __api('/mentor/caderno'+(__cadFiltro==='abertas'?'?abertas=true':''));const el=document.getElementById('cad-lista');if(el&&cad){el.innerHTML=cadernoListaHtml(cad.linhas||[],true);ligarCaderno(el);const f=document.querySelector('#cad-filtro [data-f=abertas]');if(f)f.textContent=`Abertas (${cad.abertas})`;}}\nfunction ligarCaderno(raiz){ if(!raiz) return;\n  raiz.querySelectorAll('li[data-id] .btn-flag').forEach(b=>b.onclick=async()=>{const li=b.closest('li');const id=+li.dataset.id;const r=await __api('/mentor/caderno/'+id,{riscada:b.dataset.r==='1'});if(!r){toast('Não consegui agora','circle-x');return}\n    li.classList.toggle('riscada',!!r.riscada_em);b.dataset.r=r.riscada_em?0:1;b.innerHTML=r.riscada_em?I('rotate-ccw')+'voltar':I('check')+'riscar';toast(r.riscada_em?'Riscada: essa você já sabe':'De volta pro caderno','file-text');\n    HOJE_REV.caderno_abertas=Math.max(0,(HOJE_REV.caderno_abertas||0)+(r.riscada_em?-1:1));});\n}\n/* cards (v3.9): frente → mostra → Errei/Difícil/Lembrei/Fácil com o intervalo previsto; card de questão responde como questão; lacuna esconde o trecho */\nfunction passoCard(){const c=__cards.lista[__cards.i];const box=document.getElementById('card-box');if(!box)return;\n  if(!c){fimFilaCards(box);return}\n  box.hidden=false; box.__tipo=c.tipo==='questao'&&c.questao?'questao':'card';\n  const ant=__cards.lista[__cards.i-1];\n  const cab=`${__cards.i>0&&ant&&(ant.materia||'')!==(c.materia||'')?`<p class=\"muted small\" style=\"margin:0 0 6px\">${I('layers')} baralho: <b style=\"color:var(--fg)\">${esc(c.materia||'—')}</b></p>`:''}<div class=\"qmeta\"><span class=\"rotulo\" style=\"color:var(--violet400)\">Card ${__cards.i+1} de ${__cards.lista.length} · ${esc(c.materia||'')}${c.assunto?' · '+esc(c.assunto):''}</span><span class=\"muted small\">${ESTADO_CARD[c.estado]||c.estado}${c.lapsos?` · ${c.lapsos} lapso${c.lapsos>1?'s':''}`:''}${c.retencao!=null?` · lembra ${Math.round(100*c.retencao)}%`:''} · ${esc(c.fonte||c.tipo||'')}</span></div>`;\n  if(box.__tipo==='questao'){renderCardQuestao(box,c,cab);return}\n  const prev=c.previsao||{}; const P=n=>fmtIntervalo(prev[n]);\n  box.innerHTML=`<div class=\"flash\">${cab}<div class=\"frente\">${c.cloze?clozeHtml(c.frente,__cards.virado):esc(c.frente).replace(/\\n+/g,'<br>')}</div>\n    <div class=\"verso\" id=\"card-verso\" ${__cards.virado?'':'hidden'}>${esc(c.verso).replace(/\\n+/g,'<br>')}</div>\n    <div class=\"acoes ${__cards.virado?'notas':''}\">${__cards.virado?[1,2,3,4].map(n=>`<button class=\"btn nota n${n}\" data-n=\"${n}\"><b>${NOTA_TXT[n]}</b><span>${P(n)}</span><kbd>${n}</kbd></button>`).join(''):`<button class=\"btn sec\" id=\"card-virar\">${I('rotate-ccw')}Responde na cabeça e mostra <kbd>Espaço</kbd></button>`}</div></div>`;\n  const v=box.querySelector('#card-virar');if(v)v.onclick=()=>{__cards.virado=true;passoCard()};\n  box.querySelectorAll('.nota').forEach(b=>b.onclick=()=>responderCard(c,+b.dataset.n));\n  box.__virar=()=>{const b=box.querySelector('#card-virar');if(b)b.click()};box.__nota=n=>{const b=box.querySelector(`.nota[data-n=\"${n}\"]`);if(b)b.click()};\n}\nasync function responderCard(c,nota,extra){const box=document.getElementById('card-box');if(box&&box.dataset.ocupado==='1')return;if(box)box.dataset.ocupado='1';\n  const r=await __api('/mentor/card/'+c.id+'/responder',Object.assign({sessao_id:__sessaoId},extra||{nota}));if(box)box.dataset.ocupado='0';\n  if(!r){toast('Não consegui gravar o card agora','circle-x');return null}\n  if(r.leech)toast('Leech: sai da fila e vai pro caderno — reestudar a aula','rotate-ccw');else if(r.dominado)toast('Dominada: só volta no simulado','trophy');\n  else toast(`${NOTA_TXT[r.nota]||''}: volta em ${fmtIntervalo(r.intervalo_s)}${r.nota>=3?' · +'+XP_CARD+' XP':''}`,r.nota===1?'rotate-ccw':'check');\n  if(r.volta_hoje&&!r.leech&&!r.dominado)__cards.voltam=(__cards.voltam||0)+1;\n  return r;\n}\nfunction renderCardQuestao(box,c,cab){const q=c.questao;\n  box.innerHTML=`<div class=\"flash\">${cab}<p class=\"fonte-q\">${esc(q.orgao||'')} · ${esc(q.banca||'')} ${q.ano||''}${q.soldado?' · <b style=\"color:var(--amber400)\">caiu na PM-BA</b>':''} · <b>questão que você errou</b></p><p class=\"enun\">${esc(q.enunciado)}</p>\n    <div class=\"alts\">${(q.alts||[]).map(a=>`<button class=\"alt\" data-l=\"${esc(a[0])}\" aria-pressed=\"false\"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></button>`).join('')}</div>\n    <div class=\"conf\" id=\"conf\" hidden><span class=\"muted small\">Com que segurança?</span><button data-c=\"certeza\">${I('shield-check')}Certeza <kbd>1</kbd></button><button data-c=\"duvida\">${I('circle-help')}Dúvida <kbd>2</kbd></button><button data-c=\"chute\">${I('zap')}Chute <kbd>3</kbd></button></div><div id=\"res\"></div>\n    <div class=\"atalhos\">${I('keyboard')}<span><kbd>A</kbd>–<kbd>E</kbd> responde</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> segurança</span><span><kbd>Enter</kbd> próximo</span></div></div>`;\n  let escolha=null;box.dataset.fechada='0';\n  box.querySelectorAll('.alt').forEach(b=>b.addEventListener('click',()=>{if(box.dataset.fechada==='1')return;box.querySelectorAll('.alt').forEach(x=>x.setAttribute('aria-pressed',x===b));escolha=b.dataset.l;box.querySelector('#conf').hidden=false}));\n  box.querySelectorAll('#conf button').forEach(b=>b.addEventListener('click',()=>fechar(b.dataset.c)));\n  async function fechar(conf){if(box.dataset.fechada==='1'||!escolha)return;box.dataset.fechada='1';\n    const r=await responderCard(c,null,{marcada:escolha,confianca:conf});if(!r){box.dataset.fechada='0';return}\n    const gab=(r.gabarito||q.gab||'').toUpperCase();box.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===gab)b.classList.add('certa');else if(b.dataset.l===escolha)b.classList.add('errada')});box.querySelector('#conf').hidden=true;\n    box.querySelector('#res').innerHTML=`<div class=\"resultado\"><span class=\"veredito ${r.nota>=3?'ok':'x'}\">${I(r.nota>=3?'circle-check-big':'circle-x')}${r.correta?(conf==='chute'?'Acertou no chute':'Acertou'):'Errou'}</span><p class=\"soft small\">Gabarito <b style=\"color:var(--fg)\">${esc(gab)}</b> · nota <b style=\"color:var(--fg)\">${NOTA_TXT[r.nota]}</b> · volta em ${fmtIntervalo(r.intervalo_s)}${r.dominado?' · <b>dominada</b>':''}${r.leech?' · <b>leech</b>':''}</p>${c.verso?`<div class=\"verso\">${esc(c.verso).replace(/\\n+/g,'<br>')}</div>`:''}<div class=\"acoes\"><button class=\"btn\" id=\"prox\">Próximo${I('play')}</button></div></div>`;\n    box.querySelector('#prox').onclick=()=>{__cards.i++;__cards.virado=false;passoCard()}}\n  box.__marcar=l=>{const b=box.querySelector(`.alt[data-l=\"${l}\"]`);if(b)b.click()};box.__conf=k=>{if(escolha)fechar(k)};box.__prox=()=>{const b=box.querySelector('#prox');if(b)b.click()};\n}\nasync function fimFilaCards(box){ if(__cardsTimer){clearTimeout(__cardsTimer);__cardsTimer=null}\n  const fila=await __api('/mentor/cards/fila?modo='+(__cards.modo||'hoje')+(__cardsMat?'&materia_id='+__cardsMat:'')); const cs=(fila&&fila.lista)||[];\n  if(cs.length){toast(`${cs.length} card${cs.length>1?'s':''} de volta`,'rotate-ccw');__cards.lista=cs;__cards.i=0;__cards.virado=false;passoCard();return}\n  const esp=fila&&fila.proximo_curto_em_s;\n  if(esp&&esp<3600){box.hidden=false;box.innerHTML=`<div class=\"flash\"><div class=\"frente\" style=\"text-align:center\">${I('clock')} ${fila.totais.voltam_hoje||1} card${(fila.totais.voltam_hoje||1)>1?'s':''} volta${(fila.totais.voltam_hoje||1)>1?'m':''} em <b>${fmtIntervalo(esp)}</b><br><span class=\"muted small\">os \"Errei\" desta sessão. Enquanto isso: revisões, questões ou a próxima aula. Eu aviso.</span></div><div class=\"acoes\"><button class=\"btn sec\" id=\"cards-buscar\">${I('rotate-ccw')}Buscar agora</button><button class=\"btn sec\" id=\"cards-sair\">Terminar por aqui</button></div></div>`;\n    box.querySelector('#cards-buscar').onclick=()=>fimFilaCards(box);box.querySelector('#cards-sair').onclick=()=>{if(__cardsTimer){clearTimeout(__cardsTimer);__cardsTimer=null}box.hidden=true;renderRevisao()};\n    __cardsTimer=setTimeout(()=>{__cardsTimer=null;toast('Cards de volta','rotate-ccw');fimFilaCards(box)},esp*1000+1500);return}\n  box.hidden=true;toast(__cards.modo==='fechamento'?'Dia fechado: erros de hoje revistos':'Cards do dia feitos','trophy');renderRevisao();\n}\n/* card livre */\nfunction formNovoCardHtml(assunto_id){const al=HOJE_AULAS[sess.aula];const aid=assunto_id||(al&&al.assunto_id)||null;\n  const mats=D.materias.map(m=>`<option value=\"${m.id}\">${esc(m.nome)}</option>`).join('');\n  return `<div class=\"card-novo\"><div class=\"res-cab\">${I('plus')}Novo card <span class=\"muted small\">· pergunta curta, resposta curta. Lacuna: escreva {{c::a resposta}} dentro da frente.</span></div>\n    <textarea id=\"cn-frente\" rows=\"2\" maxlength=\"600\" placeholder=\"Frente — ex.: Prazo da prisão temporária em crime comum?\"></textarea>\n    <textarea id=\"cn-verso\" rows=\"2\" maxlength=\"1200\" placeholder=\"Verso — ex.: 5 dias, prorrogável por mais 5\"></textarea>\n    <div class=\"cn-linha\"><select id=\"cn-mat\">${mats}</select><select id=\"cn-ass\"></select><button class=\"btn\" id=\"cn-salvar\">${I('check')}Salvar card</button><button class=\"btn sec\" id=\"cn-cancelar\">cancelar</button></div><p class=\"muted small\" id=\"cn-msg\"></p></div>`;}\nfunction ligarNovoCard(raiz,depois,assunto_id){const al=HOJE_AULAS[sess.aula];const aid=assunto_id||(al&&al.assunto_id)||null;\n  const sm=raiz.querySelector('#cn-mat'),sa=raiz.querySelector('#cn-ass');\n  const encher=()=>{const m=D.materias.find(x=>x.id===+sm.value);sa.innerHTML=m?m.modulos.flatMap(mo=>mo.assuntos).map(a=>`<option value=\"${a.id}\">${esc(a.nome)}</option>`).join(''):''};\n  if(aid){const m=D.materias.find(x=>x.modulos.some(mo=>mo.assuntos.some(a=>a.id===aid)));if(m)sm.value=m.id}\n  encher();if(aid)sa.value=aid;sm.onchange=encher;\n  raiz.querySelector('#cn-cancelar').onclick=()=>{raiz.hidden=true};\n  raiz.querySelector('#cn-salvar').onclick=async()=>{const fr=raiz.querySelector('#cn-frente').value.trim(),vs=raiz.querySelector('#cn-verso').value.trim();const msg=raiz.querySelector('#cn-msg');\n    if(fr.length<3||!vs){msg.textContent='Frente com 3+ caracteres e verso preenchido.';return}\n    const r=await __api('/mentor/card',{frente:fr,verso:vs,assunto_id:+sa.value||null,aula_id:(al&&al.assunto_id===+sa.value)?al.aula_id:null,tipo:fr.includes('{{c::')?'cloze':'usuario'});\n    if(!r||!r.card_id){msg.textContent=(r&&r.detail)||'Não consegui salvar (já existe igual?)';return}\n    toast('Card salvo: entra na fila de hoje','layers');HOJE_REV.cards_novos=(HOJE_REV.cards_novos||0)+1;if(depois)depois(r)};\n}\nconst CAIXAS_TXT=['1 dia','3 dias','7 dias','15 dias','30 dias'];const XP_CARD=3;\nfunction passoRev(){const rv=__rev.lista[__rev.i];const card=document.getElementById('rev-card');if(!rv){card.hidden=true;toast('Revisões do dia feitas','trophy');renderRevisao();return}\n  if(__rev.q>=rv.questoes.length){const n=rv.questoes.length;const acerto=Math.round(100*__rev.certas/Math.max(1,n));__api(`/mentor/revisao/${rv.id}/concluir`,{sessao_id:__sessaoId}).then(c=>{if(c)toast(`${rv.tipo} ${c.acerto}% · próxima ${c.proxima} em ${c.prevista}`,'rotate-ccw')});__rev.i++;__rev.q=0;__rev.marcas=[];__rev.certas=0;return passoRev()}\n  const q=rv.questoes[__rev.q];card.hidden=false;\n  card.innerHTML=`<div class=\"qmeta\"><span class=\"rotulo\" style=\"color:var(--acc400)\">${rv.tipo} · ${esc(rv.nome)}${q.repeticao?' · questão que você errou':''}</span><button class=\"btn-flag\" id=\"nao-deste\" title=\"Esta questão não é deste assunto: troca por outra e tira ela do assunto de vez\">${I('flag')}Não é deste assunto</button>${pontosHtml(rv.questoes.length,__rev.q,__rev.marcas)}</div>\n    <p class=\"fonte-q\">${esc(q.orgao_sigla||'')} · ${esc(q.banca_sigla||'')} ${q.ano||''}${q.soldado_ba?' · <b style=\"color:var(--amber400)\">caiu na PM-BA</b>':''}</p><p class=\"enun\">${esc(q.enunciado)}</p>\n    <div class=\"alts\">${(q.alternativas||[]).map(a=>`<button class=\"alt\" data-l=\"${esc(a.letra)}\" aria-pressed=\"false\"><b>${esc(a.letra)}</b><span>${esc(a.texto)}</span></button>`).join('')}</div>\n    <div class=\"conf\" id=\"conf\" hidden><span class=\"muted small\">Com que segurança?</span><button data-c=\"certeza\">${I('shield-check')}Certeza <kbd>1</kbd></button><button data-c=\"duvida\">${I('circle-help')}Dúvida <kbd>2</kbd></button><button data-c=\"chute\">${I('zap')}Chute <kbd>3</kbd></button></div><div id=\"res\"></div>\n    <div class=\"atalhos\">${I('keyboard')}<span><kbd>A</kbd>–<kbd>E</kbd> responde</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> segurança</span><span><kbd>Enter</kbd> próxima</span></div>`;\n  let escolha=null;card.dataset.fechada='0';\n  const _nd=card.querySelector('#nao-deste'); if(_nd) _nd.onclick=()=>naoEDesteAssunto(rv,q,_nd);\n  card.querySelectorAll('.alt').forEach(b=>b.addEventListener('click',()=>{if(card.dataset.fechada==='1')return;card.querySelectorAll('.alt').forEach(x=>x.setAttribute('aria-pressed',x===b));escolha=b.dataset.l;card.querySelector('#conf').hidden=false}));\n  card.querySelectorAll('#conf button').forEach(b=>b.addEventListener('click',()=>fechar(b.dataset.c)));\n  async function fechar(conf){if(card.dataset.fechada==='1'||!escolha)return;card.dataset.fechada='1';card.querySelector('#nao-deste')?.remove();\n    const res=await __api('/mentor/resposta',{questao_id:q.id,contexto:rv.tipo,marcada:escolha,assunto_id:rv.assunto_id,sessao_id:__sessaoId,confianca:conf,revisao_id:rv.id})||{correta:false,gabarito:'?'};\n    const certa=!!res.correta;const vale=certa&&conf!=='chute';__rev.marcas.push(vale);if(vale)__rev.certas++;\n    card.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===res.gabarito)b.classList.add('certa');else if(b.dataset.l===escolha)b.classList.add('errada')});card.querySelector('#conf').hidden=true;\n    const cad=res.caderno||{}; const abertas=(cad.linhas||[]).filter(l=>!l.riscada_em);\n    let extra='';\n    if(vale&&cad.riscadas){extra=`<div class=\"destino\">${I('check')}<span><b>Caderno:</b> ${cad.riscadas} linha${cad.riscadas>1?'s':''} riscada${cad.riscadas>1?'s':''} — essa você já sabe.</span></div>`;toast('Linha do caderno riscada','file-text');recarregarCaderno();}\n    if(!vale&&cad.voltaram)recarregarCaderno();\n    let erroRev=null;\n    if(!vale){ if(cad.voltaram){extra+=`<div class=\"destino\">${I('rotate-ccw')}<span><b>Caderno:</b> a linha voltou (×${(cad.linhas||[]).reduce((a,l)=>Math.max(a,l.voltou||0),0)}). Pegadinha sua de prova: relê antes da próxima sessão.</span></div>`;}\n      if(abertas.length||cad.voltaram){extra+=`<div class=\"linha-ok\">${I('file-text')}<span><b>No caderno:</b> ${(cad.linhas||[]).map(l=>esc(l.linha)).join(' · ')}</span></div>`;}\n      erroRev={k:'rev:'+q.id,questao_id:q.id,enunciado:q.enunciado,contexto:rv.tipo,assunto_id:rv.assunto_id,...propostaCard(q,escolha,res.gabarito,res.comentario_professor)}; extra+=(cad.linhas||[]).length?`<button class=\"btn-flag\" id=\"outra-linha\">${I('file-text')}Anotar outra linha</button><div id=\"outra-box\" hidden>${formLinhaHtml(erroRev)}</div>`:formLinhaHtml(erroRev); }\n    card.querySelector('#res').innerHTML=`<div class=\"resultado\"><span class=\"veredito ${vale?'ok':'x'}\">${I(vale?'circle-check-big':'circle-x')}${certa?(conf==='chute'?'Acertou no chute (conta como erro)':'Acertou'):'Errou'}</span><p class=\"soft small\">Gabarito <b style=\"color:var(--fg)\">${esc(res.gabarito)}</b></p>${res.comentario_professor?`<div class=\"resolucao\"><div class=\"res-cab\">${I('graduation-cap')}Comentário do professor, do Gran</div><div class=\"res-txt\">${esc(res.comentario_professor).replace(/\\n+/g,'<br>')}</div></div>`:''}${extra}<div class=\"acoes\" style=\"margin-top:12px\"><button class=\"btn\" id=\"prox\">${__rev.q>=rv.questoes.length-1?'Fechar a revisão':'Próxima questão'}${I('play')}</button></div></div>`;\n    if(erroRev){const ol=card.querySelector('#outra-linha');if(ol)ol.onclick=()=>{card.querySelector('#outra-box').hidden=false;ol.remove();ligarFormLinha(card,erroRev,null,recarregarCaderno);card.querySelector('.linha-txt')?.focus();};else ligarFormLinha(card,erroRev,null,recarregarCaderno);}\n    card.querySelector('.qmeta .pontos').outerHTML=pontosHtml(rv.questoes.length,-1,__rev.marcas);card.querySelector('#prox').onclick=()=>{__rev.q++;passoRev()}}\n  card.__marcar=l=>{const b=card.querySelector(`.alt[data-l=\"${l}\"]`);if(b)b.click()};card.__conf=c=>{if(escolha)fechar(c)};card.__prox=()=>{const b=card.querySelector('#prox');if(b)b.click()}}\ndocument.addEventListener('keydown',e=>{if(abaVisivel()!=='revisao'||e.target.closest('input,textarea'))return;const k=e.key.toLowerCase();\n  const cb=document.getElementById('card-box');if(cb&&!cb.hidden){ if(cb.__tipo==='questao'){ if(/^[a-e]$/.test(k)&&cb.__marcar)cb.__marcar(k.toUpperCase());else if(k==='1'&&cb.__conf)cb.__conf('certeza');else if(k==='2'&&cb.__conf)cb.__conf('duvida');else if(k==='3'&&cb.__conf)cb.__conf('chute');else if(k==='enter'&&cb.__prox){cb.__prox();e.preventDefault()} return }\n    if(k===' '||k==='enter'){cb.__virar&&cb.__virar();e.preventDefault()}else if(/^[1-4]$/.test(k)){cb.__nota&&cb.__nota(+k)}return}\n  const card=document.getElementById('rev-card');if(!card||card.hidden)return;if(/^[a-e]$/.test(k)&&card.__marcar)card.__marcar(k.toUpperCase());else if(k==='1'&&card.__conf)card.__conf('certeza');else if(k==='2'&&card.__conf)card.__conf('duvida');else if(k==='3'&&card.__conf)card.__conf('chute');else if(k==='enter'&&card.__prox)card.__prox()});\n\n/* v3.10.1 — \"Não é deste assunto\" (revisão): tira a questão do assunto inteiro, ensina o afinador e troca na hora, sem contar */\nasync function naoEDesteAssunto(rv,q,btn){\n  if(!rv||!q||!q.id||!rv.assunto_id) return;\n  const card=document.getElementById('rev-card'); if(card&&card.dataset.fechada==='1') return;\n  btn.disabled=true;\n  const r=await __api('/mentor/vinculo/assunto',{questao_id:q.id,assunto_id:rv.assunto_id,ok:false,excluir:(rv.questoes||[]).map(x=>x.id).filter(Boolean)});\n  if(!r){btn.disabled=false;toast('Não consegui registrar agora','circle-x');return}\n  toast('Anotado: essa questão sai de '+(rv.nome||'deste assunto'),'flag');\n  if(r.reposicao){rv.questoes[__rev.q]=r.reposicao;}\n  else{rv.questoes.splice(__rev.q,1);toast('Sem outra questão deste assunto pra repor','circle-help');}\n  passoRev();\n}\n/* \"Não é desta aula\": ensina o sistema e troca a questão na hora, sem contar */\nasync function naoEDestaAula(lista, al){\n  const q=lista[sess.q]; if(!q||!q.id||!al||!al.aula_id) return;\n  const excluir=[...(al.pre||[]),...(al.gate||[])].map(x=>x.id).filter(Boolean);\n  const r=await __api('/mentor/vinculo/feedback',{questao_id:q.id,aula_id:al.aula_id,ok:false,contexto:sess.etapa==='gate'?'gate':'aquecimento',excluir});\n  if(!r){toast('Não consegui registrar agora','circle-x');return}\n  toast('Anotado: essa questão sai desta aula','flag');\n  if(r.reposicao){lista[sess.q]=apiParaProto(r.reposicao,al);} else {lista.splice(sess.q,1); if(sess.q>=lista.length){sess.q=Math.max(0,lista.length-1);}}\n  salvarSess(); renderSessao();\n}\nfunction apiParaProto(q,al){const alts=(q.alternativas||[]).map(a=>[a.letra,a.texto]);const com=q.comentario_professor||'';\n  return {id:q.id,ano:q.ano,banca:q.banca_sigla||'',banca_curta:q.banca_sigla||'',orgao:q.orgao_sigla||'',cargo:q.cargo||'',enunciado:q.enunciado||'',alts,gab:(q.gabarito||'').toUpperCase(),pct:q.indice_acerto,mat:al.mat,assunto:al.assunto,explicacao:com,resolucao:com?{fonte:'professor',texto:com}:{fonte:'mentor',texto:''},soldado:!!q.soldado_ba,aula_id:al.aula_id,assunto_id:al.assunto_id};}\n";</script>
<script>
(async function(){

      ${!TOKEN?'<label class="small muted">E-mail</label><input id="l-email" type="email" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--fg)"><label class="small muted">Senha</label><input id="l-senha" type="password" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--fg)">':''}
      <label class="small muted">Endereço da API (ex.: https://api.tipmike.com.br)</label><input id="l-api" value="${localStorage.getItem('mm_api')||''}" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--fg)">

  let r;try{r=await fetch(API+'/mentor/proto/dados',{headers:{'Authorization':'Bearer '+TOKEN}})}catch(e){tela('<p style="color:var(--red400)">Não consegui falar com a API em '+API+'. <button class="btn sec" onclick="localStorage.removeItem(\'mm_api\');location.reload()">Trocar o endereço</button></p>');return}
  if(r.status===401){const rt=localStorage.getItem('tipmike_refresh');if(rt){try{const x=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(x.ok){const d=await x.json();if(d.access_token)localStorage.setItem('tipmike_access',d.access_token);if(d.refresh_token)localStorage.setItem('tipmike_refresh',d.refresh_token);location.reload();return}}catch(e){}}localStorage.removeItem('mm_token');sessionStorage.removeItem('mm_token');if(localStorage.getItem('tipmike_access')){localStorage.removeItem('tipmike_access');location.href='/';return}location.reload();return}

})();
