<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mike Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--bg2:#111827;--card:#151b2b;--card2:#1a2234;--border:#232c40;--fg:#e5e7eb;--soft:#c7cdd8;--muted:#8b93a5;
--acc:#10b981;--acc400:#34d399;--acc2:#0891b2;--cyan400:#22d3ee;--amber:#f59e0b;--amber400:#fbbf24;--red:#ef4444;--red400:#f87171;
--mono:"JetBrains Mono",ui-monospace,monospace;--sans:Inter,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan400)}button{font-family:inherit}
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(11,15,26,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:800;letter-spacing:.06em}
.logo i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04110c;font-style:normal}
.abas{display:flex;gap:2px;margin-left:8px}.abas button{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.abas button.on{color:var(--acc400);background:rgba(16,185,129,.1)}
.espaco{flex:1}.relogio{font-family:var(--mono);font-weight:700;color:var(--soft);background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center}
.relogio.on{color:var(--acc400);border-color:rgba(16,185,129,.4)}.relogio .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.relogio.on .dot{background:var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.xp{font-family:var(--mono);font-size:12px;color:var(--amber400);font-weight:700;display:flex;gap:10px;align-items:center}
main{max-width:1140px;margin:0 auto;padding:18px 18px 90px}
.painel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.painel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.rot{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc400);font-weight:700}
h1{font-size:1.5rem;margin:.2rem 0 .4rem}h2{font-size:1.15rem;margin:.4rem 0 .6rem}
.muted{color:var(--muted)}.small{font-size:13px}.soft{color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03120c;font-size:14px;box-shadow:0 0 0 1px rgba(16,185,129,.35),0 8px 24px rgba(16,185,129,.15)}
.btn.sec{background:var(--card2);color:var(--soft);box-shadow:0 0 0 1px var(--border)}.btn.warn{background:var(--amber);color:#1a1200;box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.kpi div{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi b{font-family:var(--mono);font-size:1.4rem;display:block;color:var(--fg)}.kpi span{font-size:12px;color:var(--muted)}
.lista{list-style:none;margin:0;padding:0}.lista li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)}.lista li:last-child{border:0}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--border);color:var(--soft);background:var(--card2)}
.chip.S{border-color:rgba(245,158,11,.5);color:var(--amber400)}.chip.A{border-color:rgba(16,185,129,.5);color:var(--acc400)}.chip.B{color:var(--cyan400);border-color:rgba(34,211,238,.4)}.chip.ok{border-color:rgba(16,185,129,.5);color:var(--acc400)}.chip.red{border-color:rgba(239,68,68,.5);color:var(--red400)}
.medidor{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden}.medidor i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:860px;margin:0 auto}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.enun{white-space:pre-wrap;font-size:15.5px;line-height:1.6;margin:0 0 14px}
.alts{display:grid;gap:8px}.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card2);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14.5px;line-height:1.45}
.alt b{font-family:var(--mono);color:var(--muted);min-width:20px}.alt[aria-pressed=true]{border-color:var(--cyan400);background:rgba(34,211,238,.08)}
.alt.certa{border-color:var(--acc);background:rgba(16,185,129,.12)}.alt.errada{border-color:var(--red);background:rgba(239,68,68,.1)}
.conf{display:flex;gap:8px;margin-top:12px}.conf button{flex:1;border:1px solid var(--border);background:var(--card2);color:var(--soft);border-radius:9px;padding:9px;font-weight:700;cursor:pointer}.conf button.on{border-color:var(--acc);color:var(--acc400)}
.resol{margin-top:12px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap}
.trilha{display:flex;gap:6px;margin:10px 0 16px}.trilha span{flex:1;height:6px;border-radius:999px;background:var(--bg2)}.trilha span.ok{background:var(--acc)}.trilha span.at{background:var(--cyan400)}
.anel{width:110px;height:110px}.anel text{font-family:var(--mono);font-weight:800;fill:var(--fg)}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.atalhos{margin-top:10px;font-size:11px;color:var(--muted)}kbd{font-family:var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--bg2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);border:1px solid rgba(16,185,129,.5);color:var(--fg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.login{max-width:380px;margin:80px auto}.login input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:11px 12px;margin:6px 0 12px;font-size:15px}
.err{color:var(--red400);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:7px 6px;border-bottom:1px dashed var(--border);text-align:left}th{color:var(--muted);font-weight:600;font-size:12px}td.n{font-family:var(--mono);text-align:right}
details{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--card2)}summary{cursor:pointer;font-weight:600}
.folha{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.folha button{font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:6px;padding:6px 0;cursor:pointer}.folha button.resp{color:var(--acc400);border-color:rgba(16,185,129,.45)}.folha button.at{box-shadow:0 0 0 2px var(--cyan400)}
.mobile-nav{display:none}
@media (max-width:820px){.abas{display:none}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,15,26,.95);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.mobile-nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 0;cursor:pointer}.mobile-nav button.on{color:var(--acc400)}.folha{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header class="topo">
  <div class="logo"><i>M</i>MIKE MENTOR</div>
  <nav class="abas" id="abas"></nav>
  <div class="espaco"></div>
  <div class="xp" id="xp"></div>
  <div class="relogio" id="relogio"><span class="dot"></span><span id="relogio-txt">hoje 0 min</span></div>
</header>
<main id="main"></main>
<nav class="mobile-nav" id="mnav"></nav>
<script>
// ------------------------------------------------------------- API
const API = localStorage.getItem('mm_api') || location.origin;
// dentro do site do TipMike o login já existe: reaproveita o token dele (chave tipmike_access)
let TOKEN = sessionStorage.getItem('mm_token') || localStorage.getItem('mm_token') || localStorage.getItem('tipmike_access') || '';
async function api(path, opts={}){
  const r = await fetch(API + path, {...opts, headers:{'Content-Type':'application/json', ...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}), ...(opts.headers||{})}});
  if(r.status===401){ TOKEN=''; sessionStorage.removeItem('mm_token'); localStorage.removeItem('mm_token'); if(localStorage.getItem('tipmike_access')){ location.href='/login'; } render('login'); throw new Error('login'); }
  const t = await r.text(); let j; try{ j = t?JSON.parse(t):null }catch{ j={detail:t} }
  if(!r.ok){ toast((j&&j.detail)||('erro '+r.status)); throw new Error(j&&j.detail||r.status); }
  return j;
}
const GET=(p)=>api(p), POST=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const fmtH=h=>{h=+h||0;const m=Math.round(h*60);return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')};
const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'';
// ------------------------------------------------------------- estado
const S={aba:'inicio',sessao:null,cron:{on:false,ini:null,acum:0},fluxo:null,painel:null};
const ABAS=[['inicio','Início'],['plano','Planejamento'],['edital','Edital'],['questoes','Questões'],['simulados','Simulados'],['maiscai','Mais cai']];
function navs(){document.getElementById('abas').innerHTML=ABAS.map(([k,n])=>`<button class="${S.aba===k?'on':''}" onclick="ir('${k}')">${n}</button>`).join('');
  document.getElementById('mnav').innerHTML=ABAS.map(([k,n])=>`<button class="${S.aba===k?'on':''}" onclick="ir('${k}')">${n}</button>`).join('')}
function ir(a){S.aba=a;render(a)}
setInterval(()=>{const c=S.cron;const seg=c.acum+(c.on?(Date.now()-c.ini)/1000:0);document.getElementById('relogio-txt').textContent=(c.on?'':'hoje ')+Math.floor(seg/60)+' min';document.getElementById('relogio').classList.toggle('on',c.on)},1000);
async function iniciarSessao(tipo){const r=await POST('/mentor/sessao/iniciar',{tipo});S.sessao=r.sessao_id;S.cron={on:true,ini:Date.now(),acum:0};return r.sessao_id}
async function fecharSessao(){if(!S.sessao)return;const r=await POST(`/mentor/sessao/${S.sessao}/fechar`);S.sessao=null;S.cron.on=false;S.cron.acum=0;mostrarResumo(r)}
function mostrarResumo(r){const p=r.progresso||{};document.getElementById('main').innerHTML=`<div class="painel" style="max-width:640px;margin:20px auto"><div class="rot">Sessão fechada</div><h1>${r.meta_batida?'Meta do dia batida!':'Sessão registrada'}</h1>
  <div class="kpi"><div><b>${r.resumo.questoes}</b><span>questões</span></div><div><b>${r.resumo.certas}</b><span>certas</span></div><div><b>${r.resumo.aulas}</b><span>gates fechados</span></div><div><b>+${r.xp_sessao}</b><span>XP</span></div></div>
  <p class="soft">Hoje: ${fmtH(r.horas_hoje)} de ${fmtH(r.meta_dia)} · sequência ${p.streak_dias||0} dia(s) · ${p.patente} · ${p.xp_total} XP</p>
  <div class="acoes"><button class="btn" onclick="ir('inicio')">Voltar ao início</button></div></div>`;atualizarXP(p)}
function atualizarXP(p){if(!p)return;document.getElementById('xp').innerHTML=`<span>🔥 ${p.streak_dias||0}</span><span>${esc(p.patente)}</span><span>${p.xp_total} XP</span>`}
// ------------------------------------------------------------- render
async function render(a){navs();const m=document.getElementById('main');
  try{
    if(a==='login')return vLogin(m);
    if(!TOKEN)return vLogin(m);
    if(a==='inicio')return vInicio(m);
    if(a==='plano')return vPlano(m);
    if(a==='edital')return vEdital(m);
    if(a==='questoes')return vQuestoes(m);
    if(a==='simulados')return vSimulados(m);
    if(a==='maiscai')return vMaisCai(m);
  }catch(e){if(String(e.message)!=='login')m.innerHTML=`<div class="painel"><p class="err">${esc(e.message)}</p></div>`}
}
function vLogin(m){m.innerHTML=`<div class="login painel"><div class="rot">Mike Mentor</div><h1>Entrar</h1>
  <label class="small muted">E-mail</label><input id="l-email" type="email" autocomplete="username">
  <label class="small muted">Senha</label><input id="l-senha" type="password" autocomplete="current-password">
  <label class="small muted">Endereço da API (só se o painel não estiver no mesmo endereço da API, ex.: dentro do site do TipMike)</label><input id="l-api" value="${esc(localStorage.getItem('mm_api')||'')}" placeholder="${location.origin}">
  <label class="small muted"><input type="checkbox" id="l-lembrar"> continuar conectado</label>
  <div class="acoes"><button class="btn" id="l-ok">Entrar</button></div><p class="err" id="l-err"></p></div>`;
  document.getElementById('l-ok').onclick=async()=>{try{const apiUrl=document.getElementById('l-api').value.trim();if(apiUrl)localStorage.setItem('mm_api',apiUrl);else localStorage.removeItem('mm_api');
    const r=await fetch((apiUrl||location.origin)+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('l-email').value.trim(),senha:document.getElementById('l-senha').value})});
    const j=await r.json();if(!r.ok)throw new Error(j.detail||'login falhou');TOKEN=j.access_token;(document.getElementById('l-lembrar').checked?localStorage:sessionStorage).setItem('mm_token',TOKEN);if(apiUrl)location.reload();else ir('inicio');}
    catch(e){document.getElementById('l-err').textContent=e.message}};
  document.getElementById('l-senha').onkeydown=e=>{if(e.key==='Enter')document.getElementById('l-ok').click()};
}
async function vInicio(m){const p=await GET('/mentor/painel');S.painel=p;atualizarXP(p.progresso);
  const prox=p.proxima;const sem=p.semana;
  m.innerHTML=`<div class="painel" style="border-color:rgba(16,185,129,.35)"><div class="rot">Agora</div>
    ${prox?`<h1>${esc(prox.titulo)}</h1><p class="muted">${esc(prox.materia)}${prox.duracao_s?' · '+fmtH(prox.duracao_s/3600)+' de vídeo':''}${prox.modo?' · '+esc(prox.modo.replace(/_/g,' ')):''}</p>
      <div class="acoes"><button class="btn" onclick="${prox.tipo==='aula'?`comecarAula(${prox.aula_id})`:`comecarRevisoes()`}">${prox.tipo==='aula'?'Começar o estudo':'Fazer a revisão'}</button>
      ${p.revisoes_pendentes.length?`<button class="btn sec" onclick="comecarRevisoes()">Revisões (${p.revisoes_pendentes.length})</button>`:''}${p.cards_pendentes?`<button class="btn sec" onclick="fazerCards()">Cards (${p.cards_pendentes})</button>`:''}</div>`
     :`<h1>Semana ainda não montada</h1><p class="muted">O mentor monta a semana toda segunda. Você pode montar agora.</p><div class="acoes"><button class="btn" onclick="montarSemana()">Montar a semana</button></div>`}
    <p class="small muted" style="margin-top:12px">Hoje: ${fmtH(p.horas_hoje)} de ${fmtH(p.meta_dia_h)} ${p.dia==='revisao'?'(sábado: só revisão)':p.dia==='livre'?'(domingo livre)':''}</p>
    <div class="medidor"><i style="width:${Math.min(100,100*p.horas_hoje/Math.max(0.1,p.meta_dia_h))}%"></i></div></div>
  <div class="grade">
    <div class="painel"><h3>Plano da semana ${sem?`<span class="chip">${fmtD(sem.inicio)} · fase ${esc(sem.fase||'')}</span>`:''}</h3>
      ${sem?`<div class="medidor" style="margin-bottom:10px"><i style="width:${Math.min(100,100*(+sem.horas_feitas)/Math.max(1,+sem.meta_horas))}%"></i></div><p class="small muted">${fmtH(sem.horas_feitas)} de ${fmtH(sem.meta_horas)} da meta</p>`:''}
      <ul class="lista">${p.plano.map(i=>`<li><span class="chip ${i.tier}">${i.tier}</span><span style="flex:1"><b>${esc(i.nome)}</b><br><span class="small muted">${esc(i.materia)} · ${i.n_concluidas}/${i.n_aulas} aulas · ${fmtH(i.previsto_h)}</span></span>${i.feito?'<span class="chip ok">feito</span>':''}</li>`).join('')||'<li class="muted">nada planejado</li>'}</ul></div>
    <div class="painel"><h3>Revisões pendentes</h3><ul class="lista">${p.revisoes_pendentes.map(r=>`<li><span class="chip ${r.atrasada?'red':''}">${r.tipo}</span><span style="flex:1">${esc(r.nome)}<br><span class="small muted">${esc(r.materia)} · ${fmtD(r.prevista)}</span></span></li>`).join('')||'<li class="muted">nenhuma hoje</li>'}</ul></div>
  </div>
  <div class="painel"><h3>Números</h3><div class="kpi"><div><b>${fmtH(p.kpi.horas_semana)}</b><span>na semana${p.kpi.meta_semana?' (meta '+fmtH(p.kpi.meta_semana)+')':''}</span></div><div><b>${p.kpi.dias_30}</b><span>dias estudados (30d)</span></div><div><b>${p.kpi.questoes_respondidas}</b><span>questões</span></div><div><b>${p.kpi.acerto_geral??'—'}%</b><span>acerto geral</span></div></div>
    ${p.acerto_por_materia.length?`<table style="margin-top:12px"><tr><th>Matéria</th><th>Questões</th><th>Acerto</th></tr>${p.acerto_por_materia.map(r=>`<tr><td>${esc(r.materia)}</td><td class="n">${r.n}</td><td class="n" style="color:${r.acerto<70?'var(--red400)':'var(--acc400)'}">${r.acerto}%</td></tr>`).join('')}</table>`:''}</div>`;
}
async function montarSemana(){const r=await POST('/mentor/semana/montar',{});toast(`Semana montada: ${r.itens} assuntos, ${fmtH(r.horas_previstas)}`);ir('inicio')}
// ------------------------------------------------------------- estudo por aula
async function comecarAula(id){const a=await GET(`/mentor/aula/${id}`);if(!S.sessao)await iniciarSessao('estudo');
  S.fluxo={aula:a,passo:0,idx:0,resp:{},certas:0};renderFluxo()}
function renderFluxo(){const f=S.fluxo,a=f.aula,m=document.getElementById('main');const passos=['Aquecimento','Videoaula','Fixação','Questões de concurso','Resultado'];
  const trilha=`<div class="trilha">${passos.map((_,i)=>`<span class="${i<f.passo?'ok':i===f.passo?'at':''}"></span>`).join('')}</div>`;
  const cab=`<div class="qmeta"><span class="rot">${esc(a.materia)}</span><span>${esc(a.assunto)}</span><span class="chip ${a.tier}">${a.tier}</span><span>${passos[f.passo]}</span></div>${trilha}`;
  if(f.passo===0)return renderQuestoes(m,cab,a.aquecimento,'aquecimento',()=>{f.passo=1;f.idx=0;renderFluxo()},{semConf:true,titulo:'Aquecimento: 5 questões de concurso, não contam.'});
  if(f.passo===1){m.innerHTML=`<div class="qcard">${cab}<h2>${esc(a.titulo)}</h2><p class="muted small">${a.duracao_s?fmtH(a.duracao_s/3600)+' de vídeo · assista a 1,5x':''}${a.professor?' · '+esc(a.professor):''}</p>
    ${a.url?`<div class="resol">O Gran não deixa a aula abrir dentro de outro site. O botão abaixo abre a aula numa janela ao lado, com o Mentor nesta.</div>`:''}
    ${a.tipo==='propria'?`<div class="resol"><b>Aula própria:</b> ${esc(a.lei||a.descricao||'leitura guiada')}</div>`:''}
    ${a.resumo_bolso?`<details><summary>Resumo de bolso</summary><div class="resol" style="white-space:pre-wrap">${esc(a.resumo_bolso).slice(0,6000)}</div></details>`:''}
    ${a.bizus.length?`<details open><summary>Bizus da aula (${a.bizus.length})</summary><ul class="lista">${a.bizus.map(b=>`<li><span class="chip">${esc(b.secao||b.fonte)}</span><span>${esc(b.texto)}</span></li>`).join('')}</ul></details>`:''}

  const mostra=()=>{const c=cs[i];if(!c){toast('Cards do dia feitos');return ir('inicio')}m.innerHTML=`<div class="qcard" style="text-align:center"><div class="rot">${esc(c.materia||'')} · ${esc(c.assunto||'')}</div><p class="small muted">card ${i+1} de ${cs.length} · caixa ${c.caixa}</p><h2>${esc(c.frente)}</h2><div id="verso" hidden class="resol" style="text-align:left">${esc(c.verso)}</div>
    <div class="acoes" style="justify-content:center"><button class="btn sec" onclick="document.getElementById('verso').hidden=false">Ver resposta</button><button class="btn" onclick="respCard(${c.id},true)">Lembrei</button><button class="btn warn" onclick="respCard(${c.id},false)">Não lembrei</button></div></div>`};
  window.respCard=async(id,ok)=>{await POST(`/mentor/card/${id}/responder`,{lembrou:ok});i++;mostra()};mostra()}
// ------------------------------------------------------------- teclado
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();
  if(S._sim){if(/^[a-e]$/.test(k)){const q=S._sim.s.questoes[S._sim.idx];S._sim.resp[q.id]=k.toUpperCase();renderSim()}else if(k==='arrowright'){S._sim.idx=Math.min(S._sim.s.questoes.length-1,S._sim.idx+1);renderSim()}else if(k==='arrowleft'){S._sim.idx=Math.max(0,S._sim.idx-1);renderSim()}return}
  if(!S._q)return;if(/^[a-e]$/.test(k)&&document.querySelector('.alt:not([disabled])')){marcar(k.toUpperCase())}else if(k==='1')conf('certeza');else if(k==='2')conf('duvida');else if(k==='3')conf('chute');
  else if(k==='enter'){const b=document.getElementById('q-resp');if(b&&!b.disabled)b.click();else document.querySelector('.acoes .btn')?.click()}});
render(TOKEN?'inicio':'login');
</script>
