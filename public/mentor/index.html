utton').forEach(x=>x.setAttribute('aria-pressed',x===b));renderHoras();}));\nfunction renderHoras(){\n  const hv=horasVisiveis(); const box=document.getElementById('graf-horas');\n  const ini=perHoras?addDias(HOJE,-(perHoras-1)):(Object.keys(hv).sort()[0]||HOJE);\n  const dias=[];for(let d=ini;d<=HOJE;d=addDias(d,1)) dias.push(d);\n  const total=dias.reduce((a,d)=>a+(hv[d]||0),0);\n  if(!total){box.innerHTML=`<div class=\"vazio-box\"><span class=\"icone-tile t-em\">${I('clock')}</span>Nenhum estudo registrado nesse per\u00edodo.<span class=\"small\">Use \"Come\u00e7ar o estudo\": o cron\u00f4metro conta sozinho.</span></div>`;return;}\n  const W=560,H=220,l=34,r=10,t=12,b=28,iw=W-l-r,ih=H-t-b; const max=Math.max(240,...dias.map(d=>hv[d]||0));\n  const bw=iw/dias.length; const y=v=>t+ih-ih*v/max; let s='<defs><linearGradient id=\"gb\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#10b981\"/><stop offset=\"1\" stop-color=\"#0891b2\"/></linearGradient></defs>';\n  [0,60,120,180,240].filter(v=>v<=max).forEach(v=>{s+=`<line x1=\"${l}\" x2=\"${W-r}\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"#222a3d\"/><text x=\"${l-6}\" y=\"${y(v)+4}\" text-anchor=\"end\">${v/60}h</text>`;});\n  dias.forEach((d,i)=>{const v=hv[d]||0;const x=l+i*bw+bw*.18;const fds=[0,6].includes(dt(d).getDay());\n    s+=`<rect x=\"${x}\" y=\"${y(v)}\" width=\"${bw*.64}\" height=\"${ih*v/max}\" rx=\"3\" fill=\"${fds?'#f59e0b':'url(#gb)'}\"><title>${fmtData(d)}: ${fmtMin(v)}</title></rect>`;\n    if(dias.length<=10||i%Math.ceil(dias.length/8)===0) s+=`<text x=\"${x+bw*.32}\" y=\"${H-8}\" text-anchor=\"middle\">${curta(d)}</text>`;});\n  s+=`<line x1=\"${l}\" x2=\"${W-r}\" y1=\"${y(180)}\" y2=\"${y(180)}\" stroke=\"#f87171\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\"/>`;\n  box.innerHTML=`<svg class=\"grafico\" viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"Horas estudadas por dia\">${s}</svg>\n    <div class=\"legenda\"><span><i style=\"background:linear-gradient(#10b981,#0891b2)\"></i>Seg a sex</span><span><i style=\"background:#f59e0b\"></i>Fim de semana (extra)</span><span><i style=\"background:#f87171\"></i>Meta do dia (3h)</span><span>Total: ${fmtMin(total)}</span></div>`;\n}\nfunction porMateria(rv){const m={};rv.forEach(r=>{m[r.mat]=m[r.mat]||{n:0,c:0};m[r.mat].n++;if(r.certa&&r.conf!=='chute')m[r.mat].c++;});return m;}\nfunction barrasMat(m){return `<div class=\"barras-mat\">${Object.entries(m).map(([mat,v])=>{const p=Math.round(100*v.c/v.n);return `<div><div class=\"l\"><b>${esc(mat)}</b><span>${v.n} respondidas \u00b7 <b style=\"color:${p>=70?'var(--acc400)':'var(--red400)'}\">${p}%</b></span></div><div class=\"medidor\"><i style=\"width:${p}%;${p>=70?'':'background:linear-gradient(90deg,#ef4444,#f87171)'}\"></i></div></div>`;}).join('')}</div>`;}\nfunction renderResumoQ(){\n  const rv=respostasVisiveis(); const box=document.getElementById('resumo-q');\n  if(!rv.length){box.innerHTML=`<div class=\"vazio-box\"><span class=\"icone-tile t-cy\">${I('target')}</span>Nenhuma quest\u00e3o respondida ainda.<span class=\"small\">Aparecem aqui por mat\u00e9ria, com o seu acerto.</span></div>`;return;}\n  box.innerHTML=barrasMat(porMateria(rv))+`<p class=\"muted small\" style=\"margin-top:10px\">Abaixo de 70%, o assunto entra na lista priorit\u00e1ria da sess\u00e3o da semana.</p>`;\n}\nfunction renderInicio(){renderAgora();renderHoje();renderKpis();renderHoras();renderResumoQ();pintarCrono();}\ndocument.getElementById('chk-exemplo').addEventListener('change',e=>{exemplo=e.target.checked;renderInicio();});\ndocument.getElementById('ir-questoes').addEventListener('click',()=>abrirAba('questoes'));\n\n/* ---------- EDITAL ---------- */\nlet matAtual=0, filtroEdital='corte';\nlet estudados=new Set(ler('mm3_estudei',[]));\nfunction renderSelMat(){\n  const box=document.getElementById('sel-mat'); box.innerHTML='';\n  D.materias.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.nome.replace('Direito ','').replace('L\u00edngua Portuguesa','Portugu\u00eas').replace('Igualdade Racial e de G\u00eanero','Igualdade Racial').replace(' do Brasil','');b.setAttribute('aria-pressed',i===matAtual);b.onclick=()=>{matAtual=i;renderEdital();};box.appendChild(b);});\n}\ndocument.querySelectorAll('#sel-filtro button').forEach(b=>b.addEventListener('click',()=>{filtroEdital=b.dataset.f;document.querySelectorAll('#sel-filtro button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderEdital();}));\nfunction renderEdital(){\n  renderSelMat();\n  const m=D.materias[matAtual];\n  const html=m.modulos.map(mod=>{\n    const ass=mod.assuntos.filter(a=>filtroEdital==='tudo'||(a.tipo==='conteudo'&&a.modo!=='fora'));\n    if(!ass.length) return '';\n    return `<div class=\"modulo\"><h3>${esc(mod.nome.length>90?mod.nome.slice(0,90)+'\u2026':mod.nome)}</h3>${ass.map(a=>{\n      const chave=m.nome+'|'+a.nome; const conteudo=a.tipo==='conteudo';\n      const tier=conteudo?tierHtml(a):'<span class=\"tier tN\">\u2014</span>';\n      const chips=[a.base?'<span class=\"chip base\">base</span>':'',conteudo?`<span class=\"chip ${a.modo}\">${a.modo}</span>`:'<span class=\"chip\">pr\u00e1tica</span>',a.propria?'<span class=\"chip propria\">aula pr\u00f3pria</span>':''].join('');\n      const id='a'+Math.abs([...chave].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,0));\n      return `<div class=\"assunto${conteudo&&a.modo==='fora'?' fora':''}\"><div class=\"linha\">\n        <input type=\"checkbox\" class=\"check\" aria-label=\"Estudei ${esc(a.nome)}\" data-k=\"${esc(chave)}\" ${estudados.has(chave)?'checked':''} ${conteudo?'':'disabled'}>\n        ${tier}<div class=\"nome\">${esc(a.nome)}<div class=\"chips\">${chips}</div></div>\n        <div class=\"num\">${a.base&&EXIGE[a.nome]?`<b>${a.soldado}</b> cobradas \u00b7 <b>${EXIGE[a.nome]}</b> exigem`:`<b>${a.soldado}</b> de Soldado`}<br>${fmtMin(a.video)} \u00b7 ${a.aulas.length} aula${a.aulas.length>1?'s':''} <button class=\"abrir\" aria-expanded=\"false\" aria-controls=\"${id}\" aria-label=\"Ver aulas\">${I('chevron-down')}</button></div>\n      </div><ul class=\"aulas\" id=\"${id}\" hidden>${a.aulas.map(t=>`<li>${I('circle-play')}${esc(t)}</li>`).join('')}</ul></div>`;\n    }).join('')}</div>`;\n  }).join('');\n  const lista=document.getElementById('lista-edital'); lista.innerHTML=html;\n  lista.querySelectorAll('.check').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?estudados.add(cb.dataset.k):estudados.delete(cb.dataset.k);gravar('mm3_estudei',[...estudados]);atualizarFazer();}));\n  lista.querySelectorAll('.abrir').forEach(b=>b.addEventListener('click',()=>{const ul=document.getElementById(b.getAttribute('aria-controls'));const ab=ul.hidden;ul.hidden=!ab;b.setAttribute('aria-expanded',ab);b.innerHTML=I(ab?'chevron-up':'chevron-down');}));\n  atualizarFazer();\n}\nfunction atualizarFazer(){const n=estudados.size;document.getElementById('info-fazer').textContent=n?`${n} assunto${n>1?'s':''} marcado${n>1?'s':''} como estudado${n>1?'s':''}.`:'Nada marcado ainda.';}\ndocument.getElementById('btn-fazer').addEventListener('click',()=>abrirAba('questoes'));\n\n/* ---------- QUEST\u00d5ES ---------- */\nconst MAT_DA_Q=q=>q.mat||'';\nlet qModo='estudei', qQtd=20, qSel=new Set(), qAbertas={}, qNaoAbertos={}, qJaEscolheu=false, fila=[], qi=0, escolhaQ=null;\nfunction estudadosSet(){\n  const s=new Set(estudados);\n  SEMANAS.filter(w=>w.det).forEach(w=>w.materias.forEach(([mat,ass])=>ass.forEach(a=>{\n    const cam=caminhos[w.n+'|'+a.nome]||caminhoPadrao(a); const ps=passosDe(a,cam);\n    if(passosFeitos[`${w.n}|${a.nome}|${cam}|${ps.length-1}`]) s.add(mat+'|'+a.nome);\n  })));\n  return s;\n}\nfunction assuntosDaMateria(m){const out=[];m.modulos.forEach(mod=>mod.assuntos.forEach(a=>{if(a.tipo==='conteudo')out.push(a);}));return out;}\nfunction poolAtual(){const alvo=qModo==='estudei'?estudadosSet():qSel;return D.questoes.filter(q=>alvo.has(MAT_DA_Q(q)+'|'+q.assunto));}\ndocument.querySelectorAll('#q-modo button').forEach(b=>b.addEventListener('click',()=>{qModo=b.dataset.m;if(qModo==='escolher'&&!qJaEscolheu){qJaEscolheu=true;estudadosSet().forEach(k=>qSel.add(k));}document.querySelectorAll('#q-modo button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderFiltroQ();}));\ndocument.querySelectorAll('#q-qtd button').forEach(b=>b.addEventListener('click',()=>{qQtd=+b.dataset.q;document.querySelectorAll('#q-qtd button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderFiltroQ();}));\nfunction renderFiltroQ(){\n  const est=estudadosSet(); const box=document.getElementById('q-escolha');\n  if(qModo==='estudei'){\n    const lista=[...est];\n    box.innerHTML=lista.length?`<div class=\"destino\" style=\"margin-top:12px\">${I('circle-check-big')}<span>Vem quest\u00e3o de concurso de <b style=\"color:var(--fg)\">${lista.length} assunto${lista.length>1?'s':''} estudado${lista.length>1?'s':''}</b>: ${lista.map(k=>esc(k.split('|')[1])).join(', ')}.</span></div>`\n      :`<div class=\"vazio-box\" style=\"margin-top:12px\"><span class=\"icone-tile t-am\">${I('book-open')}</span>Nada estudado ainda.<span class=\"small\">Marque \"estudei\" no Edital, conclua uma aula no In\u00edcio, ou escolha os assuntos na m\u00e3o.</span></div>`;\n  } else {\n    box.innerHTML=`<p class=\"muted small\" style=\"margin:12px 0 4px\">Os assuntos que voc\u00ea j\u00e1 estudou v\u00eam primeiro e j\u00e1 v\u00eam marcados. Os n\u00e3o estudados tamb\u00e9m podem ser escolhidos, mas a quest\u00e3o pode cobrar o que voc\u00ea ainda n\u00e3o viu.</p>`+\n    D.materias.map((m,mi)=>{\n      const ass=assuntosDaMateria(m); const estM=ass.filter(a=>est.has(m.nome+'|'+a.nome)); const naoM=ass.filter(a=>!est.has(m.nome+'|'+a.nome));\n      const selM=ass.filter(a=>qSel.has(m.nome+'|'+a.nome)).length; const aberta=qAbertas[mi]!==false; const naoAberto=!!qNaoAbertos[mi];\n      const linha=(a,estudado)=>{const k=m.nome+'|'+a.nome;return `<label class=\"q-ass${estudado?' est':''}\"><input type=\"checkbox\" data-k=\"${esc(k)}\" ${qSel.has(k)?'checked':''}><span>${esc(a.nome)}</span>${estudado?'<span class=\"chip completo\">estudado</span>':''}<span class=\"muted small\" style=\"margin-left:auto\">${a.questoes} ${a.questoes===1?'quest\u00e3o':'quest\u00f5es'}</span></label>`;};\n      return `<div class=\"q-mat\"><div class=\"q-mat-cab\"><label><input type=\"checkbox\" data-mat=\"${mi}\" ${selM===ass.length&&ass.length?'checked':''}> <b>${esc(m.nome)}</b></label>\n        <span class=\"muted small\">${estM.length} estudado${estM.length!==1?'s':''} de ${ass.length}${selM?` \u00b7 ${selM} selecionado${selM>1?'s':''}`:''}</span>\n        <button class=\"abrir\" data-abre=\"${mi}\" aria-expanded=\"${aberta}\">${I(aberta?'chevron-up':'chevron-down')}</button></div>\n        <div class=\"q-mat-corpo\" ${aberta?'':'hidden'}>\n          ${estM.length?`<div class=\"q-grupo\">Estudados</div>${estM.map(a=>linha(a,true)).join('')}`:'<p class=\"muted small\" style=\"margin:8px 0\">Nenhum assunto estudado nesta mat\u00e9ria ainda.</p>'}\n          ${naoM.length?`<button class=\"voltar\" data-nao=\"${mi}\" style=\"margin-top:8px\">${I(naoAberto?'chevron-up':'chevron-down')}${naoAberto?'Esconder':'Mostrar'} os ${naoM.length} ainda n\u00e3o estudados</button>${naoAberto?`<div class=\"q-grupo\">Ainda n\u00e3o estudados</div>${naoM.map(a=>linha(a,false)).join('')}`:''}`:''}\n        </div></div>`;\n    }).join('')+`<div class=\"q-mat pend\"><b>Outras 11 mat\u00e9rias</b> <span class=\"muted small\">entram depois da coleta das aulas</span></div>`;\n    box.querySelectorAll('input[data-k]').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?qSel.add(cb.dataset.k):qSel.delete(cb.dataset.k);renderFiltroQ();}));\n    box.querySelectorAll('input[data-mat]').forEach(cb=>cb.addEventListener('change',()=>{const m=D.materias[+cb.dataset.mat];assuntosDaMateria(m).forEach(a=>{const k=m.nome+'|'+a.nome;cb.checked?qSel.add(k):qSel.delete(k);});qAbertas[+cb.dataset.mat]=true;renderFiltroQ();}));\n    box.querySelectorAll('button[data-nao]').forEach(b=>b.addEventListener('click',()=>{const mi=+b.dataset.nao;qNaoAbertos[mi]=!qNaoAbertos[mi];renderFiltroQ();}));\n    box.querySelectorAll('button[data-abre]').forEach(b=>b.addEventListener('click',()=>{const mi=+b.dataset.abre;qAbertas[mi]=b.getAttribute('aria-expanded')!=='true';renderFiltroQ();}));\n  }\n  const alvo=qModo==='estudei'?est:qSel;\n  const noBanco=[...alvo].reduce((s,k)=>{const [mat,nome]=k.split('|');const m=D.materias.find(x=>x.nome===mat);const a=m&&assuntosDaMateria(m).find(x=>x.nome===nome);return s+(a?a.questoes:0);},0);\n  const pool=poolAtual();\n  document.getElementById('q-resumo').textContent=alvo.size?`${alvo.size} assunto${alvo.size>1?'s':''} \u00b7 ${noBanco} quest\u00f5es de concurso no banco \u00b7 no prot\u00f3tipo, ${pool.length} de exemplo`:'Escolha pelo menos um assunto.';\n  document.getElementById('q-comecar').disabled=!alvo.size;\n}\ndocument.getElementById('q-comecar').addEventListener('click',()=>{\n  fila=poolAtual().slice(0,qQtd); qi=0;\n  const card=document.getElementById('qcard'); card.hidden=false;\n  if(!fila.length){card.innerHTML=`<div class=\"vazio-box\"><span class=\"icone-tile t-am\">${I('hourglass')}</span>No prot\u00f3tipo s\u00f3 h\u00e1 6 quest\u00f5es de exemplo (Tentativa, Iter Criminis, Crime Imposs\u00edvel e Motim).<span class=\"small\">No sistema, v\u00eam as quest\u00f5es de concurso de todos os assuntos escolhidos.</span></div>`;return;}\n  renderQuestao(); card.scrollIntoView({behavior:'smooth',block:'start'});\n});\nfunction renderQuestao(){\n  const q=fila[qi]; escolhaQ=null;\n  const card=document.getElementById('qcard');\n  card.innerHTML=`<div class=\"qmeta\"><span class=\"rotulo\" style=\"color:var(--acc400)\">${esc(q.assunto)}</span><span class=\"muted small\">${qi+1} de ${fila.length}</span></div>\n   <p class=\"fonte-q\">Prova de Soldado ${esc(String(q.orgao).replace(' ','-'))} \u00b7 ${esc(q.banca_curta)} ${q.ano}</p>\n   <p class=\"enun\">${esc(q.enunciado)}</p>\n   <div class=\"alts\">${q.alts.map(([l,t])=>`<button class=\"alt\" data-l=\"${l}\" aria-pressed=\"false\"><b>${l}</b><span>${esc(t)}</span></button>`).join('')}</div>\n   <div class=\"conf\" id=\"conf\" hidden><span class=\"muted small\">Com que seguran\u00e7a?</span><button data-c=\"certeza\">${I('shield-check')}Certeza <kbd>1</kbd></button><button data-c=\"duvida\">${I('circle-help')}D\u00favida <kbd>2</kbd></button><button data-c=\"chute\">${I('zap')}Chute <kbd>3</kbd></button></div>\n   <div id=\"res-q\"></div>\n   <div class=\"atalhos\">${I('keyboard')}<span><kbd>A</kbd>\u2013<kbd>E</kbd> responde</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> seguran\u00e7a</span><span><kbd>Enter</kbd> pr\u00f3xima</span></div>`;\n  card.dataset.fechada='0';\n  card.querySelectorAll('.alt').forEach(b=>b.addEventListener('click',()=>{ if(card.dataset.fechada==='1') return; card.querySelectorAll('.alt').forEach(x=>x.setAttribute('aria-pressed',x===b)); escolhaQ=b.dataset.l; card.querySelector('#conf').hidden=false; }));\n  card.querySelectorAll('#conf button').forEach(b=>b.addEventListener('click',()=>responder(b.dataset.c)));\n}\nfunction responder(conf){\n  const card=document.getElementById('qcard'); if(card.dataset.fechada==='1'||!escolhaQ) return;\n  card.dataset.fechada='1';\n  const q=fila[qi]; const gab=q.gab; const certa=escolhaQ===gab; hookResposta(q,null,'questoes',escolhaQ,conf);\n  card.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===gab)b.classList.add('certa');else if(b.dataset.l===escolhaQ)b.classList.add('errada');});\n  card.querySelector('#conf').hidden=true;\n  respostas.push({mat:MAT_DA_Q(q),certa,conf}); gravar('mm3_resp',respostas);\n  const destino=(!certa||conf==='chute')?'Volta na pr\u00f3xima revis\u00e3o deste assunto, a pr\u00f3pria quest\u00e3o. Se errar de novo, vira reincidente e ganha um card de contraste.':(conf==='duvida'?'Conta como acerto. Na pr\u00f3xima revis\u00e3o vem uma quest\u00e3o irm\u00e3, parecida, pra confirmar.':'Acertou com certeza: fica 30 dias fora.');\n  const ver=!certa?`<span class=\"veredito x\">${I('circle-x')}Errou</span>`:(conf==='chute'?`<span class=\"veredito x\">${I('zap')}Acertou no chute (conta como erro)</span>`:`<span class=\"veredito ok\">${I('circle-check-big')}Acertou</span>`);\n  const ultima=qi>=fila.length-1;\n  card.querySelector('#res-q').innerHTML=`<div class=\"resultado\">${ver}<p class=\"soft small\">Gabarito <b style=\"color:var(--fg)\">${gab}</b>${q.pct?` \u00b7 no Gran, ${String(q.pct).replace('.',',')}% acertam`:''}</p>\n    <div class=\"resolucao\"><div class=\"res-cab\">${I('file-text')}Resolu\u00e7\u00e3o</div><div class=\"res-txt\">${esc(q.explicacao)}</div></div>\n    <div class=\"destino\">${I('rotate-ccw')}<span><b>O que acontece com ela:</b> ${destino}</span></div>\n    <div class=\"acoes\" style=\"margin-top:12px\"><button class=\"btn\" id=\"prox\">${ultima?'Terminar':'Pr\u00f3xima quest\u00e3o'}${I('play')}</button></div></div>`;\n  renderDesempenho();\n  card.querySelector('#prox').onclick=()=>{ if(ultima){card.innerHTML=`<div class=\"vazio-box\"><span class=\"icone-tile t-em\">${I('trophy')}</span>Sess\u00e3o terminada: ${fila.length} quest\u00e3o${fila.length>1?'\u00f5es':''}.<span class=\"small\">O desempenho est\u00e1 logo abaixo.</span></div>`;toast('Sess\u00e3o de quest\u00f5es terminada','trophy');return;} qi++; renderQuestao(); };\n}\nfunction renderDesempenho(){\n  const rv=respostas; const box=document.getElementById('desempenho');\n  if(!rv.length){box.innerHTML=`<div class=\"vazio-box\"><span class=\"icone-tile t-am\">${I('trophy')}</span>Responda uma quest\u00e3o pra ver o desempenho por mat\u00e9ria.</div>`;return;}\n  const certas=rv.filter(r=>r.certa&&r.conf!=='chute').length; const chutes=rv.filter(r=>r.conf==='chute').length;\n  box.innerHTML=`<div class=\"placar\"><div><b>${rv.length}</b>respondidas</div><div><b>${certas}</b>certas</div><div><b>${Math.round(100*certas/rv.length)}%</b>acerto</div><div><b>${chutes}</b>no chute</div></div>`+barrasMat(porMateria(rv));\n}\n\n/* ---------- SIMULADOS ---------- */\n// Formato do edital 2022 (FCC, prova de 22/01/2023): 80 de multipla escolha,\n// 5 alternativas, 1,25 ponto cada, 4h30. Certo/errado NAO entra no simulado.\nconst DIST_SIM=[['Conhecimentos gerais',[['L\u00edngua Portuguesa',10],['Matem\u00e1tica',8],['Hist\u00f3ria do Brasil',8],['Geografia do Brasil',8],['Atualidades',8],['Inform\u00e1tica',8]]],\n                ['Conhecimentos espec\u00edficos',[['Direito Constitucional',5],['Direitos Humanos',5],['Direito Administrativo',5],['Direito Penal',5],['Igualdade Racial e de G\u00eanero',5],['Direito Penal Militar',5]]]];\nconst AGENDA_SIM=[['2026-12-04','montado','Simulado 1 \u00b7 montado'],['2026-12-18','montado','Simulado 2 \u00b7 montado'],['2027-01-08','real','Simulado 3 \u00b7 prova real IBFC 2020 (reservada)'],\n                  ['2027-01-22','montado','Simulado 4 \u00b7 montado'],['2027-02-05','real','Simulado 5 \u00b7 prova real FCC 2012 (reservada)'],['2027-02-19','montado','Simulado 6 \u00b7 montado']];\nlet simHist=ler('mm3_sims',[]), simAtivo=null, simTimer=null;\nconst diasAte=isoStr=>Math.round((dt(isoStr)-dt(HOJE))/86400000);\nfunction questoesDemoSim(){\n  const out=[];\n  HOJE_AULAS.forEach(al=>['gate','pre'].forEach(k=>al[k].forEach(q=>{ if(q.alts.length===5) out.push({...q,mat:al.mat,assunto:al.assunto}); })));\n  D.questoes.forEach(q=>{ if(q.alts.length===5) out.push({enunciado:q.enunciado,alts:q.alts.map(([l,t])=>[l,t]),gab:q.gab,mat:MAT_DA_Q(q),assunto:q.assunto,orgao:q.orgao,banca:q.banca_curta,ano:q.ano,resolucao:{fonte:'mentor',texto:q.explicacao}}); });\n  // 5 de Penal e 5 de Penal Militar, como um recorte da prova\n  return out.slice(0,10);\n}\nfunction renderSimPainel(){\n  document.getElementById('sim-prova').hidden=true; const box=document.getElementById('sim-painel'); box.hidden=false;\n  const prox=AGENDA_SIM.find(a=>a[0]>=HOJE); const faltam=diasAte(prox[0]);\n  const tot=DIST_SIM.reduce((s,[,l])=>s+l.reduce((a,[,n])=>a+n,0),0);\n  box.innerHTML=`<div class=\"cab\"><div><h2>Simulados</h2><p class=\"muted small bloco-texto\">Do jeito da prova: 80 quest\u00f5es de m\u00faltipla escolha, cron\u00f4metro de 4h30 e sem gabarito at\u00e9 entregar. Come\u00e7am em dezembro, a cada 15 dias, numa sexta: o plano do dia vira o simulado e a corre\u00e7\u00e3o.</p></div></div>\n  <div class=\"agora sim-hero\"><div><div class=\"rot\">${I('calendar-check')}Pr\u00f3ximo simulado</div><h1>${esc(prox[2])}</h1>\n      <div class=\"mat\">${fmtData(prox[0])} \u00b7 faltam ${faltam} dias \u00b7 s\u00f3 abre no dia</div>\n      <div class=\"regras\"><span class=\"chip completo\">80 quest\u00f5es \u00b7 5 alternativas</span><span class=\"chip\">sem certo/errado</span><span class=\"chip\">4h30</span><span class=\"chip\">1,25 ponto por quest\u00e3o</span><span class=\"chip base\">m\u00ednimo do edital 2022: 60 pontos</span></div>\n      <div class=\"acoes\"><button class=\"btn\" id=\"sim-demo\">${I('play')}Ver como \u00e9 (demonstra\u00e7\u00e3o com 10 quest\u00f5es)</button></div></div>\n    <div class=\"data\">${String(faltam).padStart(2,'0')}<span class=\"muted small\" style=\"font-family:system-ui;font-size:12px;display:block;text-align:right\">dias</span></div></div>\n  <div class=\"grade2\" style=\"margin-top:0\">\n    <div class=\"painel\"><div class=\"painel-cab\"><h3>${I('list-ordered')}Como a prova \u00e9 montada</h3><span class=\"muted small\">edital 2022 \u00b7 ${tot} quest\u00f5es</span></div>\n      <table class=\"dist\">${DIST_SIM.map(([bloco,l])=>`<tr class=\"bloco\"><td>${bloco}</td><td>${l.reduce((a,[,n])=>a+n,0)}</td></tr>`+l.map(([m,n])=>`<tr><td>${esc(m)}</td><td>${n}</td></tr>`).join('')).join('')}</table>\n      <p class=\"muted small\" style=\"margin-top:10px\">Simulado montado: quest\u00f5es que o Iuri nunca viu no sistema, de prefer\u00eancia da FCC, de todo o edital (inclusive o que ainda n\u00e3o estudou, como na prova de verdade).</p></div>\n    <div class=\"painel\"><div class=\"painel-cab\"><h3>${I('calendar-days')}Calend\u00e1rio</h3><span class=\"muted small\">quinzenal, a partir de dezembro</span></div>\n      <ul class=\"cal-sim\">${AGENDA_SIM.map(([d,tipo,nome])=>`<li><span class=\"icone-tile ${tipo==='real'?'t-am':'t-cy'}\">${I(tipo==='real'?'award':'clipboard-check')}</span><div><b style=\"font-size:14px\">${esc(nome)}</b><span class=\"muted small\" style=\"display:block\">${fmtData(d)}${tipo==='real'?' \u00b7 quest\u00f5es fora do estudo at\u00e9 o dia':''}</span></div><span class=\"estado\">${I('lock')}${diasAte(d)} dias</span></li>`).join('')}</ul></div>\n  </div>\n  <div class=\"painel\" style=\"margin-top:16px\"><div class=\"painel-cab\"><h3>${I('trophy')}Hist\u00f3rico</h3></div>\n    <ul class=\"cal-sim hist\">\n      <li><span class=\"icone-tile t-em\">${I('award')}</span><div><b style=\"font-size:14px\">Prova real FCC \u00b7 edital 2022 (22/01/2023)</b><span class=\"muted small\" style=\"display:block\">feita antes do sistema \u00b7 Direitos Humanos foi 1 de 5</span></div><span class=\"nota-mini\" style=\"color:var(--acc400)\">55/80 \u00b7 68,75</span></li>\n      ${simHist.map(h=>`<li><span class=\"icone-tile ${h.pontos>=60?'t-em':'t-re'}\">${I('clipboard-check')}</span><div><b style=\"font-size:14px\">Demonstra\u00e7\u00e3o \u00b7 ${h.n} quest\u00f5es</b><span class=\"muted small\" style=\"display:block\">${esc(h.quando)} \u00b7 ${fmtMin(h.min)}</span></div><span class=\"nota-mini\" style=\"color:${h.pontos>=60?'var(--acc400)':'var(--red400)'}\">${h.certas}/${h.n} \u00b7 ${String(h.pontos.toFixed(2)).replace('.',',')}</span></li>`).join('')}\n    </ul></div>`;\n  document.getElementById('sim-demo').onclick=iniciarSim;\n}\nfunction iniciarSim(){\n  const qs=questoesDemoSim(); const seg=Math.round(4.5*3600*qs.length/80);\n  simAtivo={qs,resp:{},marc:{},idx:0,fim:Date.now()+seg*1000,ini:Date.now()};\n  document.getElementById('sim-painel').hidden=true; const box=document.getElementById('sim-prova'); box.hidden=false;\n  clearInterval(simTimer); simTimer=setInterval(()=>{const r=document.getElementById('relogio-sim'); if(!simAtivo){clearInterval(simTimer);return;} const s=Math.max(0,Math.round((simAtivo.fim-Date.now())/1000)); if(r) r.textContent=`${String(Math.floor(s/3600))}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; if(s<=0) entregarSim(true);},1000);\n  renderSimQuestao(); window.scrollTo({top:0});\n}\nfunction renderSimQuestao(){\n  const s=simAtivo, q=s.qs[s.idx], box=document.getElementById('sim-prova');\n  const resp=Object.keys(s.resp).length;\n  box.innerHTML=`<div class=\"sim-barra\"><span class=\"icone-tile t-am\" style=\"width:32px;height:32px\">${I('timer')}</span><span class=\"relogio-sim\" id=\"relogio-sim\">\u2014</span><span class=\"muted small\">Quest\u00e3o ${s.idx+1} de ${s.qs.length} \u00b7 ${resp} respondida${resp!==1?'s':''}</span><span class=\"espaco\"></span><button class=\"btn sec\" id=\"sim-sair\">${I('x')}Sair</button><button class=\"btn\" id=\"sim-entregar\">${I('send')}Entregar</button></div>\n  <div class=\"sim-grade\"><div class=\"qcard\" style=\"max-width:none\">\n      <div class=\"qmeta\"><span class=\"rotulo\" style=\"color:var(--acc400)\">${esc(q.mat)}</span><button class=\"btn-flag${s.marc[s.idx]?' on':''}\" id=\"sim-flag\">${I('flag')}${s.marc[s.idx]?'Marcada pra revisar':'Marcar pra revisar'}</button></div>\n      <p class=\"enun\">${esc(q.enunciado)}</p>\n      <div class=\"alts\">${q.alts.map(a=>`<button class=\"alt\" data-l=\"${a[0]}\" aria-pressed=\"${s.resp[s.idx]===a[0]}\"><b>${a[0]}</b><span>${esc(a[1])}</span></button>`).join('')}</div>\n      <div class=\"acoes\"><button class=\"btn sec\" id=\"sim-ant\" ${s.idx===0?'disabled':''}>${I('chevron-left')}Anterior</button><button class=\"btn sec\" id=\"sim-prox\" ${s.idx===s.qs.length-1?'disabled':''}>Pr\u00f3xima${I('chevron-right')}</button></div>\n      <div class=\"atalhos\">${I('keyboard')}<span><kbd>A</kbd>\u2013<kbd>E</kbd> marca</span><span><kbd>\u2190</kbd><kbd>\u2192</kbd> navega</span><span><kbd>M</kbd> revisar depois</span></div></div>\n    <div class=\"painel folha\"><div class=\"painel-cab\"><h3>${I('list-ordered')}Folha de respostas</h3></div>\n      <div class=\"folha-grid\">${s.qs.map((_,i)=>`<button data-i=\"${i}\" class=\"${s.resp[i]?'resp':''}${s.marc[i]?' marc':''}${i===s.idx?' at':''}\">${i+1}${s.resp[i]?' '+s.resp[i]:''}</button>`).join('')}</div>\n      <p class=\"muted small\" style=\"margin-top:10px\">Verde: respondida. Ponto amarelo: marcada pra revisar. Sem gabarito at\u00e9 entregar.</p></div></div>`;\n  box.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{s.resp[s.idx]=b.dataset.l;renderSimQuestao();});\n  box.querySelectorAll('.folha-grid button').forEach(b=>b.onclick=()=>{s.idx=+b.dataset.i;renderSimQuestao();});\n  box.querySelector('#sim-flag').onclick=()=>{s.marc[s.idx]=!s.marc[s.idx];renderSimQuestao();};\n  box.querySelector('#sim-ant').onclick=()=>{if(s.idx>0){s.idx--;renderSimQuestao();}};\n  box.querySelector('#sim-prox').onclick=()=>{if(s.idx<s.qs.length-1){s.idx++;renderSimQuestao();}};\n  box.querySelector('#sim-entregar').onclick=()=>{const falta=s.qs.length-Object.keys(s.resp).length; if(falta&&!confirm(`Ainda tem ${falta} em branco. Entregar mesmo assim?`)) return; entregarSim(false);};\n  box.querySelector('#sim-sair').onclick=()=>{if(confirm('Sair sem entregar? A demonstra\u00e7\u00e3o \u00e9 descartada.')){simAtivo=null;clearInterval(simTimer);renderSimPainel();}};\n  const r=document.getElementById('relogio-sim'); const seg=Math.max(0,Math.round((s.fim-Date.now())/1000)); r.textContent=`${Math.floor(seg/3600)}:${String(Math.floor(seg%3600/60)).padStart(2,'0')}:${String(seg%60).padStart(2,'0')}`;\n}\nfunction entregarSim(acabouTempo){\n  const s=simAtivo; if(!s) return; clearInterval(simTimer);\n  const n=s.qs.length; let certas=0; const porMat={}; const erradas=[];\n  s.qs.forEach((q,i)=>{const ok=s.resp[i]===q.gab; if(ok) certas+ \"${esc(a.letra)}\" aria-pressed=\"false\"><b>${esc(a.letra)}</b><span>${esc(a.texto)}</span></button>`).join('')}</div>\n    <div class=\"conf\" id=\"conf\" hidden><span class=\"muted small\">Com que seguran\u00e7a?</span><button data-c=\"certeza\">${I('shield-check')}Certeza <kbd>1</kbd></button><button data-c=\"duvida\">${I('circle-help')}D\u00favida <kbd>2</kbd></button><button data-c=\"chute\">${I('zap')}Chute <kbd>3</kbd></button></div><div id=\"res\"></div>\n    <div class=\"atalhos\">${I('keyboard')}<span><kbd>A</kbd>\u2013<kbd>E</kbd> responde</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> seguran\u00e7a</span><span><kbd>Enter</kbd> pr\u00f3xima</span></div>`;\n  let escolha=null;card.dataset.fechada='0';\n  card.querySelectorAll('.alt').forEach(b=>b.addEventListener('click',()=>{if(card.dataset.fechada==='1')return;card.querySelectorAll('.alt').forEach(x=>x.setAttribute('aria-pressed',x===b));escolha=b.dataset.l;card.querySelector('#conf').hidden=false}));\n  card.querySelectorAll('#conf button').forEach(b=>b.addEventListener('click',()=>fechar(b.dataset.c)));\n  async function fechar(conf){if(card.dataset.fechada==='1'||!escolha)return;card.dataset.fechada='1';\n    const res=await __api('/mentor/resposta',{questao_id:q.id,contexto:rv.tipo,marcada:escolha,assunto_id:rv.assunto_id,sessao_id:__sessaoId,confianca:conf,revisao_id:rv.id})||{correta:false,gabarito:'?'};\n    const certa=!!res.correta;const vale=certa&&conf!=='chute';__rev.marcas.push(vale);if(vale)__rev.certas++;\n    card.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===res.gabarito)b.classList.add('certa');else if(b.dataset.l===escolha)b.classList.add('errada')});card.querySelector('#conf').hidden=true;\n    card.querySelector('#res').innerHTML=`<div class=\"resultado\"><span class=\"veredito ${vale?'ok':'x'}\">${I(vale?'circle-check-big':'circle-x')}${certa?(conf==='chute'?'Acertou no chute (conta como erro)':'Acertou'):'Errou'}</span><p class=\"soft small\">Gabarito <b style=\"color:
